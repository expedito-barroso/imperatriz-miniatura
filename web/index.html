<!doctype html>
<!--
==============================================================================
Imperatriz em miniatura (estilo tiny city): web/index.html, cena 3D isométrica (three.js)
Recorte: núcleo urbano de Imperatriz (MA), camadas geradas pelo script 03
Fontes : Google Open Buildings V3 e 2.5D Temporal (2023); OpenStreetMap
         (extrato Geofabrik); IBGE, Áreas Urbanizadas 2015

Autor : Antonio Expedito Ferreira Barroso de Carvalho
Filia : UEMASUL — Universidade Estadual da Região Tocantina do Maranhão
Data  : novembro/2026 (versão 1.1.0)
three : 0.160.0 (via CDN jsDelivr)
Email : expebarroso@uemasul.edu.br
==============================================================================

Objetivo desta página
  Montar no navegador a maquete digital de Imperatriz a partir dos GeoJSON
  de data/processed/cena/ (script 03):
    edificações extrudadas até a altura de cena (h_cena), com cores por classe;
    piso vetorial: calçadas, quadras, vias por pavimento, marcações, faixas de
    pedestre, áreas verdes e água (com eixos.geojson; sem ele, chão em textura);
    base em forma de diorama, câmera isométrica e relógio do dia que move a luz.

Execução
  A página lê arquivos locais com fetch(), o que o navegador só permite através
  de um servidor. O script 04_servidor_cena.R liga esse servidor na raiz do
  projeto e abre esta página em http://127.0.0.1:4321/web/index.html.
  Abrir o arquivo com duplo clique (file://) não funciona.

Controles
  Botão esquerdo: girar   |   botão direito: arrastar   |   rodinha: zoom
  Tecla H: modo vídeo (esconde a interface e deixa só a assinatura com os créditos).
  Duplo clique numa edificação: classe, pavimentos, bairro e via mais próxima (nomes
  do OSM), coordenadas e links (Esc fecha).
  Painel inferior: hora do dia, reprodução automática, exagero vertical, camadas,
  pixel art (desligado, ao aproximar ou sempre) e tamanho do pixel, sombreamento
  de contato, contornos das copas, câmera em perspectiva e os botões Norte e
  Grade (orientação da vista).
-->

<head>

<style>
  /* ----------------------------------------------------------------------------
     Estilos da interface: tela cheia para a cena e painéis sobrepostos
     ---------------------------------------------------------------------------- */
  :root {
    --painel-fundo: rgba(20, 24, 32, 0.78);
    --painel-texto: #f2efe8;
    --painel-suave: #b9b4a8;
    --destaque: #ffd166;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a9d4ea;
               font-family: system-ui, "Segoe UI", Roboto, sans-serif; color: var(--painel-texto); }
  #cena { position: fixed; inset: 0; }

  /* Título no canto superior esquerdo */
  #titulo { position: fixed; top: 16px; left: 16px; padding: 10px 14px;
            background: var(--painel-fundo); border-radius: 10px; }
  #titulo h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: 0.2px; }
  #titulo p  { margin: 2px 0 0; font-size: 12px; color: var(--painel-suave); }
  #titulo .autoria { margin-top: 4px; font-size: 10.5px; opacity: 0.85; }
  #creditos .ressalvas { margin-top: 6px; padding-top: 5px; border-top: 1px solid rgba(232, 228, 218, 0.25); }
  #creditos .ressalvas div { margin-top: 3px; }
  #creditos .assistencia { margin-top: 6px; padding-top: 5px; border-top: 1px solid rgba(232, 228, 218, 0.25); }

  /* Mensagens de carregamento e erro, no centro */
  #status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 14px 18px; background: var(--painel-fundo); border-radius: 10px;
            font-size: 14px; max-width: min(560px, 90vw); text-align: center; }
  #status.erro { color: #ffb4a8; }

  /* Painel de controles, embaixo ao centro */
  #painel { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 6px 13px; align-items: center; padding: 7px 14px;
            background: var(--painel-fundo); border-radius: 12px; font-size: 12px;
            max-width: calc(100vw - 150px); width: max-content;
            flex-wrap: wrap; justify-content: center; }
  #painel .quebra { flex-basis: 100%; height: 0; }
  #relogio { font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 650;
             color: var(--destaque); min-width: 64px; text-align: center; }
  #painel label { display: flex; gap: 5px; align-items: center; color: var(--painel-suave); }
  #painel input[type=range] { width: 130px; }
  #painel input[type=checkbox] { margin: 0; }
  #painel #controle-tam-pixel { width: 70px; }
  #painel select { background: #2e3646; color: var(--painel-texto); border: 1px solid #4a5468;
                   border-radius: 6px; padding: 2px 4px; font-size: 12px; }
  #painel button { background: #2e3646; color: var(--painel-texto); border: 1px solid #4a5468;
                   border-radius: 8px; padding: 4px 9px; cursor: pointer; font-size: 12px; }
  #painel button:hover { background: #3a4458; }

  /* Créditos obrigatórios: um botão discreto no canto inferior direito, que
     abre a lista completa de fontes e licenças ao ser clicado */
  #botao-fontes { position: fixed; right: 12px; bottom: 16px; font-size: 12px;
                  background: rgba(20, 24, 32, 0.55); color: #e8e4da; border: none;
                  border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  #botao-fontes:hover { background: rgba(20, 24, 32, 0.8); }
  /* Caixa de identificação (duplo clique numa edificação) */
  #identificacao { position: fixed; z-index: 5; max-width: 300px; padding: 9px 11px;
                   background: rgba(20, 24, 32, 0.92); color: #f2efe8; border-radius: 8px;
                   font-size: 12px; line-height: 1.45; pointer-events: auto; }
  #identificacao b { color: var(--destaque); }
  #identificacao a { color: #9fd0ff; }
  #identificacao .fechar { float: right; cursor: pointer; margin-left: 8px; opacity: 0.8; }
  body.modo-video #identificacao { display: none !important; }
  #creditos { position: fixed; right: 12px; bottom: 48px; max-width: 380px;
              font-size: 10.5px; line-height: 1.35; color: #e8e4da;
              background: rgba(20, 24, 32, 0.85); padding: 8px 10px; border-radius: 8px; }

  /* O atributo hidden precisa vencer as regras de display acima; sem esta
     linha, o painel aparecia antes de a cena ficar pronta */
  [hidden] { display: none !important; }

  /* Modo vídeo (tecla H): esconde título, painel e botão Fontes e mostra só
     uma assinatura discreta com o autor e os créditos dos dados, que as
     licenças (OSM, Open Buildings, Copernicus, Dynamic World) pedem em
     qualquer obra derivada exibida, inclusive em vídeo */
  #assinatura-video { position: fixed; left: 12px; bottom: 10px; font-size: 11px;
                      color: rgba(255, 255, 255, 0.85); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
                      display: none; }
  body.modo-video #titulo, body.modo-video #painel, body.modo-video #botao-fontes,
  body.modo-video #creditos { display: none !important; }
  body.modo-video #assinatura-video { display: block; }
</style>

  "imports": {

<body>
<div id="cena"></div>

<div id="titulo">
  <h1>Imperatriz em miniatura</h1>
  <p id="subtitulo">Maranhão, Brasil · alturas de 2023</p>
  <!-- Assinatura do autor da página e da composição da cena. Os dados de
       terceiros mantêm suas licenças, listadas no painel "Fontes". -->

</div>

<div id="status">Carregando bibliotecas…</div>

<div id="painel" hidden>
  <div id="relogio">10:00</div>
  <button id="botao-play" type="button">▶ Reproduzir dia</button>
  <label>Hora
    <input id="controle-hora" type="range" min="5" max="19" step="0.05" value="10">
  </label>
  <label>Exagero vertical
    <input id="controle-exagero" type="range" min="1" max="6" step="0.5" value="2">
    <span id="valor-exagero">2×</span>
  </label>
  <button id="botao-norte" type="button" title="Gira a vista com o norte para cima">Norte</button>
  <button id="botao-grade" type="button" title="Volta à vista alinhada à grade das ruas">Grade</button>
  <label><input id="controle-perspectiva" type="checkbox"> Perspectiva</label>
  <div class="quebra"></div>
  <label><input id="controle-arvores" type="checkbox" checked> Árvores</label>
  <label title="Contorno escuro nas copas, na vista de perto"><input id="controle-contornos" type="checkbox" checked> Contornos</label>
  <label><input id="controle-nuvens"  type="checkbox" checked> Nuvens</label>
  <label><input id="controle-nevoa"   type="checkbox" checked> Névoa</label>

    <select id="controle-pixel">
      <option value="0">desligado</option>
      <option value="1" selected>ao aproximar</option>

  <label>Pixel

<button id="botao-fontes" type="button" hidden>Fontes</button>

<script type="module">
// -----------------------------------------------------------------------------
// 1. - Bibliotecas
// -----------------------------------------------------------------------------

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';


// -----------------------------------------------------------------------------
// 2. - Parâmetros
// -----------------------------------------------------------------------------

// 2.1 - Dados
// -----------------------------------------------------------------------------

// Pasta dos GeoJSON, relativa a esta página (web/ fica na raiz do projeto)
const CAMINHO_DADOS = '../data/processed/cena/';

// Camadas obrigatórias e opcionais. As opcionais podem faltar quando o script
// 03 não encontra feições (por exemplo, nenhuma área verde na AOI).
const CAMADAS_OBRIGATORIAS = ['aoi', 'edificacoes', 'vias'];
const CAMADAS_OPCIONAIS    = ['agua', 'verde', 'eixos', 'pedestres', 'quadras', 'faixas',
                             'arvoredo', 'pistas', 'patios', 'rio',
                             // versão 1.1.0 (script 03, seções 8.7 e 8.8)
                             'verde_extra', 'arvores_pontos', 'campo', 'riacho',
                             'bairros', 'bairros_pontos'];

// 2.2 - Aparência do chão
// -----------------------------------------------------------------------------

// Lado maior da textura do chão, em pixels. 4096 cobre a moldura de Imperatriz
// (cerca de 20 km) com uns 5 m por pixel; 8192 dobra o detalhe e quadruplica a
// memória de vídeo (cerca de 340 MB com mipmaps), arriscado em placas de 2 GB.
const TEXTURA_PX = 4096;

// Cores do chão (hexadecimal). Ordem de desenho: campo, área urbana, verde,
// água e vias, da mais larga para a mais estreita por cima.
const COR_CAMPO  = '#b7bd8f';   // fora da AOI: zona rural
const COR_URBANO = '#d6cfb6';   // dentro da AOI: solo urbano
const COR_VERDE  = '#86b765';   // verde do OSM quando não há arvoredo.geojson
const COR_GRAMA     = '#a9c47c';   // gramados (OSM e Dynamic World), sem árvores
const COR_ARVOREDO  = '#6f9f55';   // manchas de árvores do Dynamic World
const COR_AGUA   = '#5f9fc6';
const COR_VIAS = {              // por classe do OSM (coluna "classe")
  service:       '#b2ada3',
  living_street: '#a7a298',
  residential:   '#a29d93',
  unclassified:  '#a29d93',
  tertiary:      '#8f8a82',
  secondary:     '#7f7a73',
  primary:       '#6f6b65',
  trunk:         '#5e5a55'
};
const ORDEM_VIAS = ['service', 'living_street', 'residential', 'unclassified',
                    'tertiary', 'secondary', 'primary', 'trunk'];

// Espessura da base do diorama (metros, na escala da cena) e cor das laterais
const ESPESSURA_BASE_M = 260;
const COR_BASE = '#6e5640';

// 2.2.1 - Piso vetorial (quando o script 03 gera eixos.geojson)
// -----------------------------------------------------------------------------

// Com os eixos das vias, o chão deixa de ser textura e passa a ser desenhado
// em polígonos e faixas, nítidos em qualquer zoom (seção 4A). Sem eixos, a
// página volta à textura da seção 4.
//
// Ordem de desenho, de baixo para cima: campo, calçada (a AOI inteira),
// quadras, verde, água, caminhos de pedestre, vias por pavimento, marcações e
// faixas de pedestre. A calçada aparece na faixa de CALCADA_M (script 03)
// que sobra entre o leito da via e a quadra.
const COR_CALCADA    = '#e2ddd2';
const COR_QUADRA     = '#d3c9a8';
const COR_PEDESTRE   = '#e9e0c9';
const COR_PAVIMENTO  = {          // coluna "pavimento" dos eixos (opção A, script 03)
  pavimentada: '#6b6b70',         // convenção: asfalto
  bloquete:    '#a1978a',
  terra:       '#b8845a'          // laterita
};
const ORDEM_PAVIMENTO = ['terra', 'bloquete', 'pavimentada'];   // asfalto por cima nos cruzamentos

// Marcações no asfalto (coluna "marcacao"): linha central amarela tracejada
// nas vias de mão dupla e divisória branca tracejada nas de mão única com
// largura suficiente. A largura da linha é exagerada (a real tem 10 a 15 cm)
// para ser visível no zoom máximo; é uma convenção visual, não um levantamento.
const COR_MARCA_DUPLA   = '#f1c84b';
const COR_MARCA_UNICA   = '#f4f3ee';
const LARGURA_MARCA_M   = 0.45;
const TRACO_M           = 4;      // comprimento do traço
const VAO_M             = 5;      // espaço entre traços
const LARGURA_MIN_DIVISORIA_M = 6;   // mão única mais estreita fica sem divisória

// Faixas de pedestre (zebra): listras paralelas à via, cobrindo a largura
const COR_ZEBRA       = '#f4f3ee';
const ZEBRA_COMPR_M   = 3;        // extensão da faixa ao longo da via
const ZEBRA_LISTRA_M  = 0.5;      // largura de cada listra
const ZEBRA_PASSO_M   = 1.0;      // listra + intervalo

// Campo de futebol (campo.geojson): faixas de gramado alternadas no sentido
// do comprimento e marcação branca nas medidas oficiais (105 x 68 m),
// reduzidas na proporção do campo quando ele é menor
const CORES_CAMPO      = ['#5d9b46', '#6caa52'];
const N_FAIXAS_CAMPO   = 12;
const LARGURA_LINHA_CAMPO_M = 0.5;   // exagerada (a real tem 12 cm), para aparecer de longe
const COR_LINHA_CAMPO  = '#f4f3ee';

// Calha do riacho (riacho.geojson): faixa branca sinuosa
const COR_RIACHO       = '#f2f1ea';
const LARGURA_RIACHO_M = 2.5;

// Curvas e pontas das vias: leque com este número de triângulos por meia volta
const SEGMENTOS_CURVA = 6;

// Aeroporto (pistas.geojson e patios.geojson): pavimento em cinza-concreto e
// linha central tracejada branca na pista de pouso (traço de 30 m e
// intervalo de 20 m, valores aproximados das pistas reais, sem levantamento)
const COR_PISTA        = '#8d8c88';
const COR_MARCA_PISTA  = '#f4f3ee';
const LARGURA_EIXO_PISTA_M = 1;
const TRACO_PISTA_M    = 30;
const VAO_PISTA_M      = 20;

// 2.3 - Aparência das edificações
// -----------------------------------------------------------------------------

// Paletas por classe (coluna "tipo"). Cada edificação recebe uma cor de
// telhado e uma de parede sorteadas de forma determinística pelo seu id, de
// modo que a cena é sempre igual entre aberturas.
const PALETAS = {
  casa: {
    telhado: ['#c8643c', '#d9773f', '#b5523a', '#cf8a4f', '#a8a39a', '#8e8a83'],
    parede:  ['#efe6d2', '#e8dcc2', '#f3ede0']
  },
  galpao: {
    telhado: ['#b9c3c9', '#9fb3c2', '#c9c9c4'],
    parede:  ['#cfd2d4', '#bfc4c7']
  },
  vertical: {
    telhado: ['#e4e2dd', '#d3d1cc'],
    parede:  ['#f4f1ea', '#dfe6ea', '#e9dcc8']
  }
};

// 2.3.1 - Janelas nas fachadas
// -----------------------------------------------------------------------------

// Grade de janelas desenhada no shader das paredes (sem geometria nova): uma
// fileira por pavimento de PISO_M e uma coluna a cada JANELA_PERIODO_M ao
// longo da parede. Casas e edificações verticais recebem janelas; galpões,
// não. De longe, quando uma janela ficaria menor que um pixel, o desenho se
// dissolve na cor da parede (evita o moiré). À noite, uma fração das
// janelas acende ao acaso. Convenção visual, sem levantamento de fachadas.
const PISO_M            = 3;
const JANELA_PERIODO_M  = 3.2;
const JANELA_LARGURA_M  = 1.4;
const JANELA_BASE_M     = 1.0;      // peitoril, a partir do piso de cada pavimento
const JANELA_ALTURA_M   = 1.3;
const COR_VIDRO         = '#3c4858';
const COR_JANELA_ACESA  = '#ffd48a';
const PROPORCAO_ACESAS  = 0.35;

// 2.3.2 - Sombreamento de contato
// -----------------------------------------------------------------------------

// Aproximação da oclusão ambiente, calculada sem pós-processamento (leve e
// compatível com o pixel art): a base de cada parede escurece até
// CONTATO_ALTURA_M de altura, e uma faixa escura de CONTATO_FAIXA_M envolve
// cada edificação no chão. Becos estreitos entre edificações vizinhas ficam
// naturalmente mais escuros. Liga e desliga no painel ("Sombreamento").
const CONTATO_BASE      = 0.68;     // fator de cor no pé da parede
const CONTATO_ALTURA_M  = 3.5;
const CONTATO_FAIXA_M   = 2.4;      // largura total da faixa (metade fica sob a edificação)
const CONTATO_OPACIDADE = 0.2;

// Exagero vertical inicial. As alturas reais de Imperatriz (mediana de 5 m)
// ficam quase invisíveis numa cena de 15 km; o exagero só escala a malha em Y.
const EXAGERO_INICIAL = 2;

// 2.4 - Relógio do dia
// -----------------------------------------------------------------------------

const HORA_INICIAL = 10;           // hora mostrada ao abrir
const HORAS_POR_SEGUNDO = 0.25;    // velocidade da reprodução automática
// Componente norte-sul do Sol. Imperatriz fica a cerca de 5,5° S; entre
// outubro e fevereiro o Sol do meio-dia passa ao sul do zênite. Valor
// positivo = luz vinda do sul. Aproximação visual, sem cálculo astronômico.
const DESVIO_SOL_SUL = 0.25;

// 2.5 - Luz nas fachadas
// -----------------------------------------------------------------------------

// Com o Sol alto, as paredes (verticais) recebem pouca luz direta e ficam
// escuras. Duas luzes direcionais quase horizontais iluminam as fachadas:
// uma do lado do observador inicial (sudeste) e outra, mais fraca, do lado
// oposto, para que as fachadas continuem legíveis quando a cena é girada.
const LUZ_FACHADA         = 0.9;
const LUZ_FACHADA_OPOSTA  = 0.4;
const ELEVACAO_FACHADA    = 0.35;   // inclinação dessas luzes (0 = horizontal)

// 2.6 - Árvores
// -----------------------------------------------------------------------------

// Árvores em miniatura espalhadas ao acaso dentro das manchas de árvores do
// Dynamic World (arvoredo.geojson, script 03, seção 8.4.1); sem essa camada,
// dentro das áreas verdes do OSM. Os gramados ficam sem árvores.
// A densidade é uma escolha visual, não um inventário arbóreo. A forma é a de
// folhosa (copa arredondada, mais larga que alta), coerente com a vegetação da
// transição Cerrado-Amazônia; os pontos que caem na água ou sobre edificações
// são descartados (seção 5A.2.1).
const ARVORES_POR_HECTARE = 32;          // um maciço a cada ~310 m² (versão 1.0: 25)
const MAX_ARVORES         = 40000;       // teto, para não pesar a cena
const ALTURA_ARVORE_M     = [6, 12];     // altura total, sorteada por árvore
const AFASTAMENTO_M       = 3;           // folga mínima entre árvore e edificação
// versão 1.1.0: mais tons, do verde-escuro ao amarelado (item 10)
const CORES_COPA = ['#4f8f3a', '#5c9e41', '#3f7d33', '#6aa84a', '#457f36', '#7aa94e',
                    '#3d7334', '#86ad4c', '#9cb24f', '#5f8a3a', '#4a7d45'];
const COR_TRONCO = '#7a5a3c';
const SEMENTE_ARVORES = 42;              // mesma semente = mesmas posições
// Árvores em posições calculadas pelo script 03 (arvores_pontos.geojson:
// canteiros, calçadas, praças e casos indicados). As de rua (canteiro e
// calçada) são menores. O teto evita pesar a cena em placas modestas.
const ALTURA_ARVORE_RUA_M  = [5, 9];
// Árvores indicadas pelo autor (script 03, seção 2.13): altura e diâmetro da
// copa vêm do arquivo (altura_m, copa_m). RAIO_ARRANJO_COPA é a meia largura
// de uma copa em couve-flor, em unidades do arranjo (anel de bolotas a cerca
// de 0,56 do centro, com raio de cerca de 0,48; seção 2.6.4.1).
const RAIO_ARRANJO_COPA    = 1.04;
const MAX_ARVORES_PONTUAIS = 60000;

// 2.6.3 - Árvores na orla das lagoas
// -----------------------------------------------------------------------------

// As lagoas urbanas (partes da água com área entre os dois limites; o
// Tocantins, muito maior, fica de fora) recebem uma fileira de árvores em
// volta, na margem, onde não houver via nem edificação
// 2.6.4 - Copas em cachos, sombras e tremor das folhas
// -----------------------------------------------------------------------------

// Cada copa é um cacho de bolotas facetadas (três arranjos diferentes,
// sorteados por árvore), mais claras no alto e verde-azuladas embaixo. Cada
// bolota treme com fase própria, além do balanço da árvore inteira (2.6.2).

// Lê um GeoJSON ou JSON. Camadas opcionais ausentes devolvem null.
async function lerJSON(nome, opcional = false) {
  const resposta = await fetch(CAMINHO_DADOS + nome);
  if (!resposta.ok) {

  }

// 3.3 - Percurso das geometrias
// -----------------------------------------------------------------------------

// Devolve a lista de polígonos de uma feição, cada polígono como lista de
// anéis (o primeiro é o contorno externo, os demais são buracos). Aceita
// Polygon e MultiPolygon; outros tipos são ignorados.
function poligonosDe(feicao) {
  const g = feicao.geometry;
  if (!g) return [];
  if (g.type === 'Polygon') return [g.coordinates];
  if (g.type === 'MultiPolygon') return g.coordinates;
  return [];
}

// Limites (xmin, ymin, xmax, ymax) de um conjunto de camadas, em metros locais
function limitesDe(camadas) {
  const lim = { xmin: Infinity, ymin: Infinity, xmax: -Infinity, ymax: -Infinity };
  for (const camada of camadas) {
    if (!camada) continue;
    for (const f of camada.features) {
      for (const pol of poligonosDe(f)) {
        for (const anel of pol) {
          for (const [x, y] of anel) {
            if (x < lim.xmin) lim.xmin = x;
            if (x > lim.xmax) lim.xmax = x;
            if (y < lim.ymin) lim.ymin = y;
            if (y > lim.ymax) lim.ymax = y;
          }
        }
      }
    }
  }
  return lim;
}

// 3.4 - Cores
// -----------------------------------------------------------------------------

// Converte '#rrggbb' em [r, g, b] de 0 a 255
function rgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

// Paletas convertidas uma vez para [r, g, b]
const PALETAS_RGB = Object.fromEntries(
  Object.entries(PALETAS).map(([tipo, p]) =>
    [tipo, { telhado: p.telhado.map(rgb), parede: p.parede.map(rgb) }])
);

// Escolha determinística: o id é espalhado por uma multiplicação de Knuth,
// para que ids vizinhos não recebam cores em sequência
function sortear(lista, id, semente) {
  const k = (Math.imul(id + semente, 2654435761) >>> 0);
  return lista[k % lista.length];
}


// 3.5 - Sorteio reprodutível
// -----------------------------------------------------------------------------

// Gerador pseudoaleatório mulberry32: a mesma semente produz sempre a mesma
// sequência, de modo que árvores e nuvens ficam no mesmo lugar a cada abertura
function sorteador(semente) {
  let a = semente >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 3.6 - Geometria plana
// -----------------------------------------------------------------------------

// Ponto dentro de polígono com buracos, pela regra par-ímpar (raio horizontal):
// cada cruzamento de aresta inverte o estado
function pontoDentro(x, y, aneis) {
  let dentro = false;
  for (const anel of aneis) {
    for (let i = 0, j = anel.length - 1; i < anel.length; j = i++) {
      const [xi, yi] = anel[i], [xj, yj] = anel[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) dentro = !dentro;
    }
  }
  return dentro;
}

// Área de um anel pela fórmula do cadarço (valor absoluto, m²)
function areaAnel(anel) {
  let s = 0;
  for (let i = 0, j = anel.length - 1; i < anel.length; j = i++) {
    s += (anel[j][0] + anel[i][0]) * (anel[j][1] - anel[i][1]);
  }
  return Math.abs(s) / 2;
}

// 3.7 - Orientação da grade das ruas (seção 2.8.4)
// -----------------------------------------------------------------------------

// Ângulo dominante dos eixos, em radianos, entre -45° e 45°. Ruas
// perpendiculares contam como a mesma direção: cada ângulo é multiplicado
// por 4 (período de 90°) antes da média circular, ponderada pelo comprimento.
function anguloGrade(eixos) {
  let c = 0, s = 0;
  for (const f of eixos?.features ?? []) {
    if (!CLASSES_GRADE.includes(f.properties?.classe)) continue;
    for (const linha of linhasDe(f)) {
      for (let i = 0; i < linha.length - 1; i++) {
        const dx = linha[i + 1][0] - linha[i][0], dy = linha[i + 1][1] - linha[i][1];
        const w = Math.hypot(dx, dy);
        const a = 4 * Math.atan2(dy, dx);
        c += w * Math.cos(a); s += w * Math.sin(a);
      }
    }
  }
  return (c === 0 && s === 0) ? 0 : Math.atan2(s, c) / 4;
}

// Azimute da câmera (convenção do three.js: ângulo a partir do sul, girando
// para leste) que mostra a grade nas diagonais da tela: o canto sudeste da
// vista isométrica clássica (45°) girado pelo ângulo da grade
function azimuteIso(anguloGradeRad) {
  return Math.PI / 4 + anguloGradeRad;
}

// -----------------------------------------------------------------------------
// 4. - Chão: textura desenhada em canvas
// -----------------------------------------------------------------------------

// O chão é uma imagem: as vias chegam do script 03 como polígonos fundidos por
// classe, com milhares de buracos (as quadras). Triangulá-los em 3D seria
// lento; o canvas 2D do navegador preenche polígonos com buracos diretamente
// (regra "evenodd").
function desenharChao(dados, lim) {

  // 4.1 - Tamanho do canvas proporcional à extensão da cena
  const larguraM = lim.xmax - lim.xmin;
  const alturaM  = lim.ymax - lim.ymin;
  const escala   = TEXTURA_PX / Math.max(larguraM, alturaM);   // pixels por metro
  const canvas   = document.createElement('canvas');
  canvas.width   = Math.round(larguraM * escala);
  canvas.height  = Math.round(alturaM * escala);
  const ctx      = canvas.getContext('2d');

  // 4.2 - Conversão de metros locais para pixels (o eixo y do canvas cresce
  // para baixo; o norte fica em cima)
  const px = x => (x - lim.xmin) * escala;
  const py = y => (lim.ymax - y) * escala;

  // 4.3 - Preenche todas as feições de uma camada com uma cor
  function preencher(camada, cor, filtro = null) {
    if (!camada) return;
    const caminho = new Path2D();
    for (const f of camada.features) {
      if (filtro && !filtro(f)) continue;
      for (const pol of poligonosDe(f)) {
        for (const anel of pol) {
          anel.forEach(([x, y], i) => i === 0 ? caminho.moveTo(px(x), py(y))
                                              : caminho.lineTo(px(x), py(y)));
          caminho.closePath();
        }
      }
    }
    ctx.fillStyle = cor;
    ctx.fill(caminho, 'evenodd');
  }

  // 4.4 - Camadas, de baixo para cima
  ctx.fillStyle = COR_CAMPO;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  preencher(dados.aoi,   COR_URBANO);
  preencher(dados.verde, dados.arvoredo ? COR_GRAMA : COR_VERDE);
  preencher(dados.arvoredo, COR_ARVOREDO);
  preencher(dados.patios, COR_PISTA);
  preencher(dados.agua,  COR_AGUA);
  for (const classe of ORDEM_VIAS) {
    preencher(dados.vias, COR_VIAS[classe], f => f.properties.classe === classe);
  }

  // 4.5 - Textura com mipmaps e filtragem anisotrópica, para não serrilhar as
  // vias finas quando a câmera fica inclinada
  const textura = new THREE.CanvasTexture(canvas);
  textura.colorSpace = THREE.SRGBColorSpace;
  textura.minFilter = THREE.LinearMipmapLinearFilter;
  textura.generateMipmaps = true;
  return textura;
}


// -----------------------------------------------------------------------------
// 4A. - Piso vetorial: polígonos e faixas no plano do chão
// -----------------------------------------------------------------------------

// Cada camada do piso vira uma malha plana em y = 0. Como todas ficam no mesmo
// plano, a sobreposição é resolvida pela ordem de desenho (renderOrder) e não
// pela profundidade: as malhas do piso não gravam profundidade (depthWrite
// false) e são desenhadas antes de tudo, de baixo para cima. As edificações e
// as árvores, desenhadas depois, ficam sempre por cima do piso.

// 4A.1 - Acumulador de triângulos (vértices em metros locais x, y)
function novoAcumulador() {
  return { pos: [], idx: [], nv: 0 };
}

// acrescenta um vértice (x leste, y norte) e devolve seu índice
function verticePiso(ac, x, y) {
  ac.pos.push(x, 0, -y);    // eixos da cena: X = leste, Y = altura, Z = sul
  return ac.nv++;
}

// 4A.2 - Polígonos com buracos, triangulados pelo earcut do three.js
function acumularPoligonos(ac, camada, filtro = null) {
  if (!camada) return;
  for (const f of camada.features) {
    if (filtro && !filtro(f)) continue;
    for (const pol of poligonosDe(f)) {
      // anéis sem o ponto final repetido, como vetores 2D
      const aneis = pol.map(anel => {
        const [x0, y0] = anel[0], [xn, yn] = anel[anel.length - 1];
        const a = (x0 === xn && y0 === yn) ? anel.slice(0, -1) : anel;
        return a.map(([x, y]) => new THREE.Vector2(x, y));
      });
      if (aneis[0].length < 3) continue;
      const triangulos = THREE.ShapeUtils.triangulateShape(aneis[0], aneis.slice(1));
      // os índices do earcut se referem ao contorno seguido dos buracos
      const inicio = ac.nv;
      for (const anel of aneis) for (const p of anel) verticePiso(ac, p.x, p.y);
      for (const [a, b, c] of triangulos) ac.idx.push(inicio + a, inicio + b, inicio + c);
    }
  }
}

// 4A.3 - Leque circular de raio r em (x, y), para pontas e curvas das vias
function acumularDisco(ac, x, y, r) {
  const centro = verticePiso(ac, x, y);
  const n = 2 * SEGMENTOS_CURVA;
  const primeiro = ac.nv;
  for (let i = 0; i < n; i++) {
    const t = i / n * 2 * Math.PI;
    verticePiso(ac, x + r * Math.cos(t), y + r * Math.sin(t));
  }
  for (let i = 0; i < n; i++) ac.idx.push(centro, primeiro + i, primeiro + (i + 1) % n);
}

// 4A.4 - Retângulo de largura w centrado no segmento (x0, y0)-(x1, y1)
function acumularRetangulo(ac, x0, y0, x1, y1, w) {
  const dx = x1 - x0, dy = y1 - y0;
  const comp = Math.hypot(dx, dy);
  if (comp < 1e-6) return;
  const nx = -dy / comp * w / 2, ny = dx / comp * w / 2;   // normal à esquerda
  const a = verticePiso(ac, x0 + nx, y0 + ny);
  const b = verticePiso(ac, x0 - nx, y0 - ny);
  const c = verticePiso(ac, x1 - nx, y1 - ny);
  const d = verticePiso(ac, x1 + nx, y1 + ny);
  ac.idx.push(a, b, c, a, c, d);
}

// Lista de linhas (cada uma, lista de [x, y]) de uma feição LineString ou
// MultiLineString
function linhasDe(feicao) {
  const g = feicao.geometry;
  if (!g) return [];
  if (g.type === 'LineString') return [g.coordinates];
  if (g.type === 'MultiLineString') return g.coordinates;
  return [];
}

// 4A.5 - Faixa de largura w ao longo de uma linha: um retângulo por segmento
// e um disco em cada ponta e em cada vértice onde a linha muda de direção
// (fecha a cunha aberta entre dois retângulos e arredonda os cruzamentos)
function acumularFaixa(ac, linha, w) {
  const n = linha.length;
  if (n < 2) return;
  for (let i = 0; i < n - 1; i++) {
    const [x0, y0] = linha[i], [x1, y1] = linha[i + 1];
    acumularRetangulo(ac, x0, y0, x1, y1, w);
  }
  acumularDisco(ac, linha[0][0], linha[0][1], w / 2);
  acumularDisco(ac, linha[n - 1][0], linha[n - 1][1], w / 2);
  for (let i = 1; i < n - 1; i++) {
    const [xa, ya] = linha[i - 1], [xb, yb] = linha[i], [xc, yc] = linha[i + 1];
    const t1 = Math.atan2(yb - ya, xb - xa), t2 = Math.atan2(yc - yb, xc - xb);
    let giro = Math.abs(t2 - t1);
    if (giro > Math.PI) giro = 2 * Math.PI - giro;
    if (giro > 0.05) acumularDisco(ac, xb, yb, w / 2);   // acima de cerca de 3°
  }
}

// 4A.6 - Linha tracejada ao longo de uma linha: o padrão traço + vão segue a
// distância acumulada, de modo que o tracejado continua de um segmento ao outro
function acumularTracejado(ac, linha, w, traco = TRACO_M, vao = VAO_M) {
  const periodo = traco + vao;
  let s = 0;   // distância acumulada no início do segmento
  for (let i = 0; i < linha.length - 1; i++) {
    const [x0, y0] = linha[i], [x1, y1] = linha[i + 1];
    const comp = Math.hypot(x1 - x0, y1 - y0);
    if (comp < 1e-6) continue;
    const ux = (x1 - x0) / comp, uy = (y1 - y0) / comp;
    // primeiro traço que alcança este segmento
    let ini = Math.floor(s / periodo) * periodo;
    while (ini < s + comp) {
      const a = Math.max(ini, s) - s;
      const b = Math.min(ini + traco, s + comp) - s;
      if (b > a) acumularRetangulo(ac, x0 + ux * a, y0 + uy * a, x0 + ux * b, y0 + uy * b, w);
      ini += periodo;
    }
    s += comp;
  }
}

// 4A.7 - Faixa de pedestre: listras paralelas à via, espaçadas ao longo da
// largura do leito. angulo = direção da via (radianos a partir do leste).
function acumularZebra(ac, x, y, angulo, largura) {
  const ux = Math.cos(angulo), uy = Math.sin(angulo);    // ao longo da via
  const nx = -uy, ny = ux;                               // através da via
  const n = Math.max(1, Math.floor(largura / ZEBRA_PASSO_M));
  for (let k = 0; k < n; k++) {
    const t = -largura / 2 + (k + 0.5) * largura / n;    // posição através da via
    const cx = x + nx * t, cy = y + ny * t;
    acumularRetangulo(ac,
      cx - ux * ZEBRA_COMPR_M / 2, cy - uy * ZEBRA_COMPR_M / 2,
      cx + ux * ZEBRA_COMPR_M / 2, cy + uy * ZEBRA_COMPR_M / 2, ZEBRA_LISTRA_M);
  }
}

// 4A.7.1 - Normal constante (para cima) num BufferGeometry sem normais. O
// sombreamento facetado calcula a normal no próprio shader e não a usa, mas o
// cálculo da sombra do three.js lê o atributo normal; sem ele, a coordenada
// da sombra vira um valor inválido e nenhuma sombra aparece (seção 2.8.1).
// Um byte por componente basta.
function normalParaCima(geo) {
  const n = geo.attributes.position.count;
  const normais = new Int8Array(n * 3);
  for (let i = 1; i < normais.length; i += 3) normais[i] = 127;
  geo.setAttribute('normal', new THREE.BufferAttribute(normais, 3, true));
  return geo;
}

// 4A.8 - Malha de uma cor a partir de um acumulador, na posição "ordem" da
// pilha do piso. flatShading calcula a normal no próprio shader (todas
// apontam para cima); DoubleSide dispensa conferir a orientação dos triângulos.
function malhaPiso(ac, cor, ordem) {
  if (ac.nv === 0) return null;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(ac.pos, 3));
  geo.setIndex(new THREE.BufferAttribute(new Uint32Array(ac.idx), 1));
  geo.computeBoundingSphere();
  normalParaCima(geo);
  const mat = new THREE.MeshStandardMaterial({
    color: cor, roughness: 1, metalness: 0, flatShading: true,
    side: THREE.DoubleSide, depthWrite: false
  });
  const malha = new THREE.Mesh(geo, mat);
  malha.renderOrder = ordem;
  return malha;
}

// 4A.9 - Piso completo. Devolve um grupo com uma malha por camada e cor, e a
// contagem de triângulos (para conferência no console)
function construirPiso(dados) {
  const grupo = new THREE.Group();
  let ordem = -90;   // abaixo de zero: antes das edificações e das árvores
  let triangulos = 0;
  function empilhar(ac, cor) {
    const m = malhaPiso(ac, cor, ordem++);
    if (m) { grupo.add(m); triangulos += ac.idx.length / 3; }
  }

  // superfícies
  let ac = novoAcumulador(); acumularPoligonos(ac, dados.aoi);     empilhar(ac, COR_CALCADA);
  ac = novoAcumulador();     acumularPoligonos(ac, dados.quadras); empilhar(ac, COR_QUADRA);
  // com as manchas de árvores do Dynamic World, o verde restante é gramado
  ac = novoAcumulador();     acumularPoligonos(ac, dados.verde);
  empilhar(ac, dados.arvoredo ? COR_GRAMA : COR_VERDE);
  ac = novoAcumulador();     acumularPoligonos(ac, dados.arvoredo); empilhar(ac, COR_ARVOREDO);
  // canteiros e quadras indicadas (versão 1.1.0): gramado
  ac = novoAcumulador();     acumularPoligonos(ac, dados.verde_extra); empilhar(ac, COR_GRAMA);
  ac = novoAcumulador();     acumularPoligonos(ac, dados.agua);    empilhar(ac, COR_AGUA);
  // calha do riacho
  ac = novoAcumulador();
  for (const f of dados.riacho?.features ?? []) {
    for (const linha of linhasDe(f)) acumularFaixa(ac, linha, LARGURA_RIACHO_M);
  }
  empilhar(ac, COR_RIACHO);
  // campo de futebol: faixas de gramado e marcação (seção 4A.9.1)
  for (const f of dados.campo?.features ?? []) {
    const campo = desenharCampo(f);
    campo.faixas.forEach((a, k) => empilhar(a, CORES_CAMPO[k]));
    empilhar(campo.linhas, COR_LINHA_CAMPO);
  }

  // aeroporto: pátios, pistas e taxiways, e a linha central da pista de pouso
  ac = novoAcumulador();
  acumularPoligonos(ac, dados.patios);
  for (const f of dados.pistas?.features ?? []) {
    for (const linha of linhasDe(f)) acumularFaixa(ac, linha, f.properties.largura);
  }
  empilhar(ac, COR_PISTA);
  ac = novoAcumulador();
  for (const f of dados.pistas?.features ?? []) {
    if (f.properties.tipo !== 'runway') continue;
    for (const linha of linhasDe(f)) {
      acumularTracejado(ac, linha, LARGURA_EIXO_PISTA_M, TRACO_PISTA_M, VAO_PISTA_M);
    }
  }
  empilhar(ac, COR_MARCA_PISTA);

  // caminhos de pedestre e ciclovias (por baixo das vias de carro)
  ac = novoAcumulador();
  for (const f of dados.pedestres?.features ?? []) {
    for (const linha of linhasDe(f)) acumularFaixa(ac, linha, f.properties.largura);
  }
  empilhar(ac, COR_PEDESTRE);

  // leito das vias, uma malha por pavimento
  for (const pav of ORDEM_PAVIMENTO) {
    ac = novoAcumulador();
    for (const f of dados.eixos.features) {
      if (f.properties.pavimento !== pav) continue;
      for (const linha of linhasDe(f)) acumularFaixa(ac, linha, f.properties.largura);
    }
    empilhar(ac, COR_PAVIMENTO[pav]);
  }

  // marcações: amarela nas vias de mão dupla, branca nas de mão única largas
  const acDupla = novoAcumulador(), acUnica = novoAcumulador();
  for (const f of dados.eixos.features) {
    const p = f.properties;
    if (p.marcacao === 'mao_dupla') {
      for (const linha of linhasDe(f)) acumularTracejado(acDupla, linha, LARGURA_MARCA_M);
    } else if (p.marcacao === 'mao_unica' && p.largura >= LARGURA_MIN_DIVISORIA_M) {
      for (const linha of linhasDe(f)) acumularTracejado(acUnica, linha, LARGURA_MARCA_M);
    }
  }
  empilhar(acDupla, COR_MARCA_DUPLA);
  empilhar(acUnica, COR_MARCA_UNICA);

  // faixas de pedestre mapeadas no OSM
  ac = novoAcumulador();
  for (const f of dados.faixas?.features ?? []) {
    if (f.geometry?.type !== 'Point') continue;
    const [x, y] = f.geometry.coordinates;
    acumularZebra(ac, x, y, f.properties.angulo, f.properties.largura);
  }
  empilhar(ac, COR_ZEBRA);

  return { grupo, triangulos };
}

// 4A.9.1 - Campo de futebol a partir do retângulo do script 03 (seção 8.7.6):
// u = ao longo do comprimento, v = ao longo da largura, origem no centro.
// Medidas oficiais multiplicadas por k = menor das razões comprimento/105 e
// largura/68.
function desenharCampo(f) {
  const { comprimento: L, largura: W, angulo } = f.properties;
  const anel = poligonosDe(f)[0][0];
  const cx = (anel[0][0] + anel[1][0] + anel[2][0] + anel[3][0]) / 4;
  const cy = (anel[0][1] + anel[1][1] + anel[2][1] + anel[3][1]) / 4;
  const ux = Math.cos(angulo), uy = Math.sin(angulo);
  const p = (u, v) => [cx + ux * u - uy * v, cy + uy * u + ux * v];
  const k = Math.min(L / 105, W / 68);
  // faixas de gramado alternadas, em dois acumuladores (duas cores)
  const faixas = [novoAcumulador(), novoAcumulador()];
  const passo = L / N_FAIXAS_CAMPO;
  for (let i = 0; i < N_FAIXAS_CAMPO; i++) {
    const u0 = -L / 2 + i * passo;
    acumularRetangulo(faixas[i % 2], ...p(u0, 0), ...p(u0 + passo, 0), W);
  }
  // marcação: contorno, linha do meio, círculo central, grandes áreas,
  // pequenas áreas e marcas do pênalti
  const linhas = novoAcumulador(), w = LARGURA_LINHA_CAMPO_M;
  const ret = (u0, v0, u1, v1) => acumularFaixa(linhas, [p(u0, v0), p(u1, v0), p(u1, v1), p(u0, v1), p(u0, v0)], w);
  ret(-L / 2, -W / 2, L / 2, W / 2);
  acumularFaixa(linhas, [p(0, -W / 2), p(0, W / 2)], w);
  const circ = [];
  for (let i = 0; i <= 40; i++) { const t = i / 40 * 2 * Math.PI; circ.push(p(9.15 * k * Math.cos(t), 9.15 * k * Math.sin(t))); }
  acumularFaixa(linhas, circ, w);
  acumularDisco(linhas, ...p(0, 0), 0.6);
  for (const lado of [-1, 1]) {
    const fundo = lado * L / 2;
    ret(fundo, -20.15 * k, fundo - lado * 16.5 * k, 20.15 * k);
    ret(fundo, -9.15 * k, fundo - lado * 5.5 * k, 9.15 * k);
    acumularDisco(linhas, ...p(fundo - lado * 11 * k, 0), 0.6);
  }
  return { faixas, linhas };
}

// 4A.10 - Luzes da noite (seção 2.6.5): o leito das vias recebe uma faixa de
// luz quente, somada à cor do piso (mistura aditiva), com uma malha por nível
// de intensidade; os postes são discos claros dos dois lados das vias
// principais. A opacidade das malhas segue o relógio (seção 7.2).
function construirLuzesNoturnas(eixos) {
  const grupo = new THREE.Group();
  const materiais = [];
  if (!eixos) return { grupo, ajustar: () => {} };
  const niveis = [...new Set(Object.values(LUZ_VIAS))];
  for (const nivel of niveis) {
    const ac = novoAcumulador();
    for (const f of eixos.features) {
      if (LUZ_VIAS[f.properties.classe] !== nivel) continue;
      for (const linha of linhasDe(f)) acumularFaixa(ac, linha, f.properties.largura + 2);
    }
    if (ac.nv === 0) continue;
    const m = malhaPiso(ac, COR_LUZ_VIA, -55);
    m.material = new THREE.MeshBasicMaterial({ color: COR_LUZ_VIA, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
    m.userData.nivel = nivel * 0.4;
    materiais.push(m);
    grupo.add(m);
  }
  // postes: um disco de 0,8 m a cada ESPACO_POSTES_M, na borda do leito
  const ac = novoAcumulador();
  for (const f of eixos.features) {
    if (!CLASSES_POSTES.includes(f.properties.classe)) continue;
    const afast = f.properties.largura / 2 + 0.8;
    for (const linha of linhasDe(f)) {
      let resto = ESPACO_POSTES_M / 2;
      for (let i = 0; i < linha.length - 1; i++) {
        const [x0, y0] = linha[i], [x1, y1] = linha[i + 1];
        const comp = Math.hypot(x1 - x0, y1 - y0);
        if (comp < 1e-6) continue;
        const ux = (x1 - x0) / comp, uy = (y1 - y0) / comp;
        let d = resto;
        for (; d < comp; d += ESPACO_POSTES_M) {
          const x = x0 + ux * d, y = y0 + uy * d;
          acumularDisco(ac, x - uy * afast, y + ux * afast, 0.8);
          acumularDisco(ac, x + uy * afast, y - ux * afast, 0.8);
        }
        resto = d - comp;
      }
    }
  }
  if (ac.nv > 0) {
    const m = malhaPiso(ac, COR_POSTE, -54);
    m.material = new THREE.MeshBasicMaterial({ color: COR_POSTE, transparent: true, opacity: 0,
      depthWrite: false, side: THREE.DoubleSide });
    m.userData.nivel = 1;
    materiais.push(m);
    grupo.add(m);
  }
  // noite: 0 (dia) a 1 (noite); malhas apagadas ficam invisíveis
  function ajustar(noite) {
    for (const m of materiais) {
      m.material.opacity = m.userData.nivel * noite;
      m.visible = noite > 0.01;
    }
  }
  ajustar(0);
  return { grupo, ajustar };
}


// -----------------------------------------------------------------------------
// 5. - Edificações: uma única malha com todas as extrusões
// -----------------------------------------------------------------------------

// Uma malha por edificação (117 mil objetos) travaria o navegador. Todas as
// extrusões são escritas em um único BufferGeometry: três anéis de vértices
// por edificação (base da parede, topo da parede, telhado), cores por vértice
// em 8 bits e índices de 32 bits. O sombreamento facetado (flatShading)
// dispensa normais por vértice.
//
// Simplificações: só o contorno externo é extrudado (buracos internos, raros
// no Open Buildings, são ignorados) e todas as bases ficam em y = 0 (a cota
// z_base do script 03 não é usada, porque o chão é plano).
function construirEdificacoes(geojson) {

  // 5.1 - Primeira passada: contornos válidos e contagem de vértices
  const itens = [];
  let totalVertices = 0;
  let maxIndices = 0;
  for (const f of geojson.features) {
    const pol = poligonosDe(f)[0];
    if (!pol) continue;
    let anel = pol[0];
    // remove o ponto final repetido que fecha o anel no GeoJSON
    const [x0, y0] = anel[0], [xn, yn] = anel[anel.length - 1];
    if (x0 === xn && y0 === yn) anel = anel.slice(0, -1);
    const n = anel.length;
    if (n < 3) continue;
    itens.push({ anel, p: f.properties });
    totalVertices += 3 * n;
    maxIndices    += 6 * n + 3 * (n - 2);
  }

  // 5.2 - Vetores tipados do tamanho exato
  const posicoes = new Float32Array(totalVertices * 3);
  const cores    = new Uint8Array(totalVertices * 3);
  const tipos    = new Uint8Array(totalVertices);     // 0 casa, 1 galpão, 2 vertical (janelas)
  const indices  = new Uint32Array(maxIndices);
  let v = 0;    // próximo vértice livre
  let k = 0;    // próximo índice livre

  // grava um vértice (x, y no mapa; h = altura) com sua cor
  let tipoAtual = 0;
  function vertice(x, y, h, c) {
    tipos[v] = tipoAtual;
    // eixos da cena: X = leste, Y = altura, Z = sul (norte em -Z)
    posicoes[v * 3]     = x;
    posicoes[v * 3 + 1] = h;
    posicoes[v * 3 + 2] = -y;
    cores[v * 3]     = c[0];
    cores[v * 3 + 1] = c[1];
    cores[v * 3 + 2] = c[2];
    return v++;
  }

  // 5.3 - Segunda passada: paredes e telhados
  for (const { anel, p } of itens) {
    const n = anel.length;
    const paleta  = PALETAS_RGB[p.tipo] ?? PALETAS_RGB.casa;
    const cTelh   = sortear(paleta.telhado, p.id, 0);
    const cParede = sortear(paleta.parede,  p.id, 7);
    const h       = p.h_cena;
    tipoAtual     = p.tipo === 'galpao' ? 1 : (p.tipo === 'vertical' ? 2 : 0);

    // anéis de vértices: base e topo da parede, e telhado
    const base = v;
    for (const [x, y] of anel) vertice(x, y, 0, cParede);
    const topo = v;
    for (const [x, y] of anel) vertice(x, y, h, cParede);
    const telhado = v;
    for (const [x, y] of anel) vertice(x, y, h, cTelh);

    // paredes: um quadrilátero (dois triângulos) por aresta do contorno
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      indices[k++] = base + i; indices[k++] = base + j; indices[k++] = topo + j;
      indices[k++] = base + i; indices[k++] = topo + j; indices[k++] = topo + i;
    }

    // telhado: triangulação do contorno (algoritmo earcut, embutido no three.js)
    const contorno = anel.map(([x, y]) => new THREE.Vector2(x, y));
    const triangulos = THREE.ShapeUtils.triangulateShape(contorno, []);
    for (const [a, b, c] of triangulos) {
      indices[k++] = telhado + a; indices[k++] = telhado + b; indices[k++] = telhado + c;
    }
  }

  // 5.4 - Geometria e material
  const geometria = new THREE.BufferGeometry();
  geometria.setAttribute('position', new THREE.BufferAttribute(posicoes, 3));
  geometria.setAttribute('color',    new THREE.BufferAttribute(cores, 3, true));
  geometria.setAttribute('aTipo',    new THREE.BufferAttribute(tipos, 1));
  normalParaCima(geometria);   // só para o cálculo da sombra (seção 4A.7.1)
  geometria.setIndex(new THREE.BufferAttribute(indices.subarray(0, k), 1));
  geometria.computeBoundingSphere();

  // DoubleSide: os contornos chegam com orientação variada (horário ou
  // anti-horário); desenhar os dois lados evita paredes invisíveis
  const material = fachadas(new THREE.MeshStandardMaterial({
    vertexColors: true, flatShading: true, roughness: 0.92, metalness: 0,
    side: THREE.DoubleSide
  }));

  // 5.5 - Índice espacial para a identificação por clique (seção 6.10): cada
  // edificação entra nas células de 50 m que o seu retângulo envolvente toca
  const CELULA = 50;
  const grade = new Map();
  itens.forEach((it, i) => {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [x, y] of it.anel) {
      x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
    }
    for (let cx = Math.floor(x0 / CELULA); cx <= Math.floor(x1 / CELULA); cx++) {
      for (let cy = Math.floor(y0 / CELULA); cy <= Math.floor(y1 / CELULA); cy++) {
        const chave = cx + '_' + cy;
        if (!grade.has(chave)) grade.set(chave, []);
        grade.get(chave).push(i);
      }
    }
  });
  const hMax = itens.reduce((m, it) => Math.max(m, it.p.h_cena), 0);

  // devolve a edificação cujo contorno contém (x, y) e cuja altura alcança h
  function edificacaoEm(x, y, h) {
    const lista = grade.get(Math.floor(x / CELULA) + '_' + Math.floor(y / CELULA));
    if (!lista) return null;
    for (const i of lista) {
      const it = itens[i];
      if (it.p.h_cena >= h && pontoDentro(x, y, [it.anel])) return it;
    }
    return null;
  }

  // edificação mais próxima de (x, y), até raioMax metros (contornos em L ou
  // em U podem ter o centro fora do próprio contorno)
  function edificacaoProxima(x, y, raioMax = 30) {
    const dentro = edificacaoEm(x, y, 0);
    if (dentro) return dentro;
    let melhor = null, dMin = raioMax;
    const r = Math.ceil(raioMax / CELULA);
    for (let cx = Math.floor(x / CELULA) - r; cx <= Math.floor(x / CELULA) + r; cx++) {
      for (let cy = Math.floor(y / CELULA) - r; cy <= Math.floor(y / CELULA) + r; cy++) {
        for (const i of grade.get(cx + '_' + cy) ?? []) {
          const a = itens[i].anel;
          for (let k = 0; k < a.length; k++) {
            const [x0, y0] = a[k], [x1, y1] = a[(k + 1) % a.length];
            const dx = x1 - x0, dy = y1 - y0, l2 = dx * dx + dy * dy || 1;
            const t = Math.max(0, Math.min(1, ((x - x0) * dx + (y - y0) * dy) / l2));
            const d = Math.hypot(x - x0 - t * dx, y - y0 - t * dy);
            if (d < dMin) { dMin = d; melhor = itens[i]; }
          }
        }
      }
    }
    return melhor;
  }

  return { malha: new THREE.Mesh(geometria, material), n: itens.length, edificacaoEm, edificacaoProxima, hMax,
           contato: faixaContato(itens) };
}

// 5.6 - Janelas e base escurecida, acrescentadas ao shader padrão (seções
// 2.3.1 e 2.3.2). A posição de cada fragmento em metros reais (antes do
// exagero vertical) chega pela variável vPosObj; a normal do plano (sombreamento
// facetado) separa paredes de telhados. As janelas seguem a parede: a
// coordenada horizontal é a projeção da posição na direção da parede.
const uNoite   = { value: 0 };   // 0 de dia, 1 à noite (relógio, seção 7.2)
const uContato = { value: 1 };   // sombreamento de contato ligado ou não
function fachadas(material) {
  material.customProgramCacheKey = () => 'fachadas';
  material.onBeforeCompile = shader => {
    shader.uniforms.uNoite = uNoite;
    shader.uniforms.uContato = uContato;
    shader.vertexShader = 'attribute float aTipo;\nvarying float vTipo;\nvarying vec3 vPosObj;\n' +
      shader.vertexShader.replace('#include <begin_vertex>',
        '#include <begin_vertex>\n  vTipo = aTipo;\n  vPosObj = position;');
    const vidro = new THREE.Color(COR_VIDRO), acesa = new THREE.Color(COR_JANELA_ACESA);
    const f = v => v.toFixed(4);
    shader.fragmentShader = 'uniform float uNoite, uContato;\nvarying float vTipo;\nvarying vec3 vPosObj;\n' +
      'float hashJanela(vec3 p) { return fract(sin(dot(p, vec3(12.9898, 78.233, 37.719))) * 43758.5453); }\n' +
      shader.fragmentShader.replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
      {
        // normal no espaço do mundo (a matriz de vista é ortonormal)
        vec3 nW = normalize((vec4(normal, 0.0) * viewMatrix).xyz);
        float parede = 1.0 - step(0.5, abs(nW.y));
        // base escurecida: contato com o chão
        float ao = mix(${f(CONTATO_BASE)}, 1.0, smoothstep(0.0, ${f(CONTATO_ALTURA_M)}, vPosObj.y));
        diffuseColor.rgb *= mix(1.0, ao, parede * uContato);
        // janelas: só em paredes de casas (0) e edificações verticais (2)
        if (parede > 0.5 && vTipo != 1.0) {
          vec2 t = normalize(vec2(-nW.z, nW.x));
          float s = dot(vPosObj.xz, t);
          float y = vPosObj.y;
          float fx = fract(s / ${f(JANELA_PERIODO_M)});
          float fy = fract(y / ${f(PISO_M)});
          float meia = ${f(JANELA_LARGURA_M / JANELA_PERIODO_M / 2)};
          float jan = step(0.5 - meia, fx) * step(fx, 0.5 + meia)
                    * step(${f(JANELA_BASE_M / PISO_M)}, fy) * step(fy, ${f((JANELA_BASE_M + JANELA_ALTURA_M) / PISO_M)})
                    * step(0.6, y);
          // dissolve o desenho quando um metro ocupa menos de ~2 pixels
          float mpp = max(fwidth(s), fwidth(y));
          jan *= 1.0 - smoothstep(0.35, 0.8, mpp);
          diffuseColor.rgb = mix(diffuseColor.rgb, vec3(${f(vidro.r)}, ${f(vidro.g)}, ${f(vidro.b)}), 0.65 * jan);
          float acende = step(hashJanela(vec3(floor(s / ${f(JANELA_PERIODO_M)}), floor(y / ${f(PISO_M)}),
                                              floor(vPosObj.x * 0.05) + floor(vPosObj.z * 0.05) * 31.0)),
                              ${f(PROPORCAO_ACESAS)});
          totalEmissiveRadiance += vec3(${f(acesa.r)}, ${f(acesa.g)}, ${f(acesa.b)}) * jan * acende * uNoite * 0.9;
        }
      }`);
  };
  return material;
}

// 5.7 - Faixa de contato no chão: um retângulo escuro e translúcido ao longo
// de cada aresta do contorno, com metade da largura sob a própria edificação
// (escondida por ela) e metade para fora. Uma única malha para a cena toda.
function faixaContato(itens) {
  let nArestas = 0;
  for (const it of itens) nArestas += it.anel.length;
  const pos = new Float32Array(nArestas * 4 * 3);
  const idx = new Uint32Array(nArestas * 6);
  let v = 0, k = 0;
  const w = CONTATO_FAIXA_M / 2;
  for (const { anel } of itens) {
    const n = anel.length;
    for (let i = 0; i < n; i++) {
      const [x0, y0] = anel[i], [x1, y1] = anel[(i + 1) % n];
      const comp = Math.hypot(x1 - x0, y1 - y0);
      if (comp < 0.5) continue;
      const nx = -(y1 - y0) / comp * w, ny = (x1 - x0) / comp * w;
      // estende cada retângulo meia largura nas pontas, para fechar os cantos
      const ux = (x1 - x0) / comp * w, uy = (y1 - y0) / comp * w;
      const pts = [[x0 - ux + nx, y0 - uy + ny], [x0 - ux - nx, y0 - uy - ny],
                   [x1 + ux - nx, y1 + uy - ny], [x1 + ux + nx, y1 + uy + ny]];
      for (const [x, y] of pts) { pos[v * 3] = x; pos[v * 3 + 1] = 0; pos[v * 3 + 2] = -y; v++; }
      idx[k++] = v - 4; idx[k++] = v - 3; idx[k++] = v - 2;
      idx[k++] = v - 4; idx[k++] = v - 2; idx[k++] = v - 1;
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos.subarray(0, v * 3), 3));
  geo.setIndex(new THREE.BufferAttribute(idx.subarray(0, k), 1));
  geo.computeBoundingSphere();
  const malha = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    color: '#1d2420', transparent: true, opacity: CONTATO_OPACIDADE, depthWrite: false, side: THREE.DoubleSide }));
  malha.renderOrder = -60;   // acima do piso, abaixo das edificações (seção 4A)
  return malha;
}


// -----------------------------------------------------------------------------
// 5A. - Árvores: duas malhas instanciadas (copas e troncos)
// -----------------------------------------------------------------------------

// 5A.0 - Vento: tempo compartilhado por todos os materiais das árvores, avançado
// no laço de desenho (seção 8.2)
const tempoVento = { value: 0 };

// Sombras das árvores: deslocamento por metro de altura, atualizado pelo
// relógio do dia (seção 7.2), e o material, cuja opacidade segue a luz
const deslocSombra = { value: new THREE.Vector2(0.3, 0.2) };
let materialSombra = null;

// 5A.0.1 - Copa em cacho: bolotas facetadas [x, y, z, raio] num espaço de
// raio ~1, com degradê de cor (claro no alto, escuro embaixo) e a fase de
// tremor de cada bolota (atributo aFase)

// Copa em "couve-flor" (item 10): uma bolota no alto, um anel de cinco e duas
// mais baixas, com tamanhos e posições sorteados (semente fixa)
function arranjoCouveFlor(semente) {
  const r = sorteador(semente);
  const lobos = [[0, 0.32, 0, 0.5 + 0.08 * r()]];
  for (let k = 0; k < 5; k++) {
    const a = (k + 0.5 * r()) / 5 * Math.PI * 2, d = 0.5 + 0.12 * r();
    lobos.push([d * Math.cos(a), 0.02 + 0.1 * r(), d * Math.sin(a), 0.42 + 0.12 * r()]);
  }
  for (let k = 0; k < 2; k++) {
    const a = r() * Math.PI * 2;
    lobos.push([0.45 * Math.cos(a), -0.28, 0.45 * Math.sin(a), 0.38 + 0.08 * r()]);
  }
  return lobos;
}
// Maciço (item 10): três copas menores encostadas, em alturas diferentes,
// ocupando cerca do dobro da largura de uma copa; usado no arvoredo do
// Dynamic World, onde as copas se fundem num dossel
function arranjoMacico(semente) {
  const r = sorteador(semente);
  const lobos = [];
  const centros = [[0, 0], [0.95, 0.45], [-0.7, 0.85]];
  for (const [cx0, cz0] of centros) {
    const cx = cx0 + 0.15 * (r() - 0.5), cz = cz0 + 0.15 * (r() - 0.5);
    const s = 0.7 + 0.3 * r(), dy = 0.2 * (r() - 0.5);
    lobos.push([cx, dy + 0.3 * s, cz, 0.5 * s]);
    for (let k = 0; k < 3; k++) {
      const a = (k + 0.5 * r()) / 3 * Math.PI * 2;
      lobos.push([cx + 0.45 * s * Math.cos(a), dy, cz + 0.45 * s * Math.sin(a), 0.42 * s]);
    }
  }
  // recentra o maciço na origem
  const mx = lobos.reduce((t, l) => t + l[0], 0) / lobos.length;
  const mz = lobos.reduce((t, l) => t + l[2], 0) / lobos.length;
  return lobos.map(([x, y, z, rr]) => [x - mx, y, z - mz, rr]);
}
// inflar > 0: casca do contorno, com cada bolota maior que a da copa
function geometriaCacho(lobos, inflar = 0) {
  const topo = new THREE.Color(COR_COPA_TOPO), base = new THREE.Color(COR_COPA_BASE), c = new THREE.Color();
  return mergeGeometries(lobos.map(([x, y, z, r], i) => {
    const g = new THREE.IcosahedronGeometry(r * (1 + inflar) + (inflar > 0 ? 0.02 : 0), 0).translate(x, y, z);
    const pos = g.attributes.position;
    const cores = new Float32Array(pos.count * 3), fases = new Float32Array(pos.count);
    for (let v = 0; v < pos.count; v++) {
      c.copy(base).lerp(topo, THREE.MathUtils.smoothstep(pos.getY(v), -0.7, 0.8));
      cores[v * 3] = c.r; cores[v * 3 + 1] = c.g; cores[v * 3 + 2] = c.b;
      fases[v] = i * 1.9;
    }
    g.setAttribute('color', new THREE.BufferAttribute(cores, 3));
    g.setAttribute('aFase', new THREE.BufferAttribute(fases, 1));
    return g;
  }));
}
const direcaoVento = new THREE.Vector2(
  Math.cos(THREE.MathUtils.degToRad(DIRECAO_VENTO_GRAUS)),
  -Math.sin(THREE.MathUtils.degToRad(DIRECAO_VENTO_GRAUS)));   // norte = -Z na cena

// Acrescenta o balanço ao shader de um material de árvore. O deslocamento é
// aplicado depois da matriz de cada cópia (instanceMatrix), em metros da
// cena, e cresce com a altura do vértice: base parada, topo com a amplitude
// toda. A fase vem da posição da árvore (coluna 3 da matriz).
// Com tremor = true, a geometria traz o atributo aFase (fase de cada bolota
// da copa, seção 5A.4) e cada bolota treme com fase própria. A chave de cache
// separa as duas versões do shader, que de outro modo o three.js confundiria.
function balancar(material, tremor = false) {
  material.customProgramCacheKey = () => 'balanco' + (tremor ? '_tremor' : '');
  material.onBeforeCompile = shader => {
    shader.uniforms.uTempo = tempoVento;
    shader.uniforms.uDirVento = { value: direcaoVento };
    shader.vertexShader = `uniform float uTempo;\nuniform vec2 uDirVento;\n` +
      (tremor ? 'attribute float aFase;\n' : '') +
      shader.vertexShader.replace('#include <project_vertex>', `
        vec4 mvPosition = vec4( transformed, 1.0 );
        #ifdef USE_INSTANCING
          mvPosition = instanceMatrix * mvPosition;
          float fase   = instanceMatrix[3].x * 0.031 + instanceMatrix[3].z * 0.047;
          float peso   = pow(clamp(mvPosition.y / ${ALTURA_REF_VENTO_M.toFixed(1)}, 0.0, 1.5), 1.5);
          float rajada = 0.65 + 0.35 * sin(uTempo * 0.37 + fase * 0.5);
          float desl   = ${AMPLITUDE_VENTO_M.toFixed(2)} * peso * rajada * sin(uTempo * ${FREQ_VENTO.toFixed(2)} + fase);
          mvPosition.x += desl * uDirVento.x;
          mvPosition.z += desl * uDirVento.y;
          ${tremor ? `
          float trem = ${TREMOR_M.toFixed(2)} * peso * sin(uTempo * ${FREQ_TREMOR.toFixed(2)} + fase * 3.0 + aFase);
          mvPosition.x += trem * uDirVento.y;
          mvPosition.z -= trem * uDirVento.x;
          mvPosition.y += 0.4 * trem;` : ''}
        #endif
        mvPosition = modelViewMatrix * mvPosition;
        gl_Position = projectionMatrix * mvPosition;`);
  };
  return material;
}

// Uma InstancedMesh desenha milhares de cópias da mesma forma numa única
// chamada à placa de vídeo; cada cópia tem sua própria posição, escala e cor.
function plantarArvores(verde, agua, edificacoes, eixos = null, extras = null) {
  const grupo = new THREE.Group();
  if (!verde && !agua && !extras) return { grupo, n: 0, nPalmeiras: 0 };
  const sortear01 = sorteador(SEMENTE_ARVORES);

  // 5A.1 - Polígonos verdes, com área e retângulo envolvente
  const alvos = [];
  let areaTotal = 0;
  for (const f of verde?.features ?? []) {
    for (const aneis of poligonosDe(f)) {
      const area = areaAnel(aneis[0]) - aneis.slice(1).reduce((s, a) => s + areaAnel(a), 0);
      if (area <= 0) continue;
      let xmin = Infinity, ymin = Infinity, xmax = -Infinity, ymax = -Infinity;
      for (const [x, y] of aneis[0]) {
        xmin = Math.min(xmin, x); xmax = Math.max(xmax, x);
        ymin = Math.min(ymin, y); ymax = Math.max(ymax, y);
      }
      // grande = recebe palmeiras (seção 2.6.1)
      const grande = area >= AREA_MIN_PALMEIRAS_HA * 10000;
      alvos.push({ aneis, area, xmin, ymin, xmax, ymax, grande });
      areaTotal += area;
    }
  }

  // 5A.1.1 - Lagoas: contorno externo das partes da água com área entre os
  // limites da seção 2.6.3
  const lagoas = [];
  for (const f of agua?.features ?? []) {
    for (const aneis of poligonosDe(f)) {
      const area = areaAnel(aneis[0]);
      if (area >= AREA_MIN_LAGOA_HA * 1e4 && area <= AREA_MAX_LAGOA_HA * 1e4) lagoas.push(aneis[0]);
    }
  }

  // 5A.1.2 - Árvores pontuais do script 03 (seção 2.6): posições já
  // filtradas lá; as de rua (canteiro e calçada) ganham altura menor. Acima
  // do teto, fica uma a cada tantas, de modo uniforme.
  let extrasXY = [];
  for (const f of extras?.features ?? []) {
    if (f.geometry?.type !== 'Point') continue;
    const [x, y] = f.geometry.coordinates;
    // [x, y, de rua, maciço, altura fixa, copa fixa]: as duas últimas só nas
    // árvores indicadas pelo autor
    extrasXY.push([x, y, ['canteiro', 'calcada'].includes(f.properties?.origem), false,
                   f.properties?.altura_m ?? null, f.properties?.copa_m ?? null]);
  }
  // acima do teto, só as árvores de calçada são rareadas (uma a cada
  // tantas); canteiros, praças e casos indicados ficam todos
  if (extrasXY.length > MAX_ARVORES_PONTUAIS) {
    const calcada = [], outras = [];
    for (const f of extras.features) {
      if (f.geometry?.type !== 'Point') continue;
      const [x, y] = f.geometry.coordinates;
      const o = f.properties?.origem;
      (o === 'calcada' ? calcada : outras).push([x, y, o === 'canteiro' || o === 'calcada', false,
                                                 f.properties?.altura_m ?? null, f.properties?.copa_m ?? null]);
    }
    const vagas = Math.max(0, MAX_ARVORES_PONTUAIS - outras.length);
    const passo = calcada.length / Math.max(vagas, 1);
    console.warn(`Árvores pontuais: ${extrasXY.length} acima do teto; calçadas rareadas de ${calcada.length} para ${Math.min(vagas, calcada.length)}.`);
    extrasXY = outras.concat(Array.from({ length: Math.min(vagas, calcada.length) }, (_, i) => calcada[Math.floor(i * passo)]));
  }

  // 5A.2 - Quantidade: densidade por hectare, reduzida se passar do teto
  let densidade = ARVORES_POR_HECTARE;
  if (areaTotal / 10000 * densidade > MAX_ARVORES) densidade = MAX_ARVORES / (areaTotal / 10000);

  // 5A.2.1 - Máscara de exclusão: um canvas que cobre só a extensão das áreas
  // verdes, com a água e as edificações (mais AFASTAMENTO_M de folga)
  // pintadas de preto. Consultar um pixel é instantâneo, ao passo que testar
  // cada ponto contra o polígono do rio (milhares de vértices) seria lento.
  let vx0 = Infinity, vy0 = Infinity, vx1 = -Infinity, vy1 = -Infinity;
  for (const a of alvos) {
    vx0 = Math.min(vx0, a.xmin); vx1 = Math.max(vx1, a.xmax);
    vy0 = Math.min(vy0, a.ymin); vy1 = Math.max(vy1, a.ymax);
  }
  // a máscara também cobre a orla das lagoas
  const folgaOrla = 2 * AFASTAMENTO_ORLA_M;
  for (const anel of lagoas) {
    for (const [x, y] of anel) {
      vx0 = Math.min(vx0, x - folgaOrla); vx1 = Math.max(vx1, x + folgaOrla);
      vy0 = Math.min(vy0, y - folgaOrla); vy1 = Math.max(vy1, y + folgaOrla);
    }
  }
  // sem áreas verdes nem lagoas, a máscara fica com 1 pixel e só as árvores
  // pontuais são plantadas
  if (!Number.isFinite(vx0)) { vx0 = vy0 = 0; vx1 = vy1 = 1; }
  // resolução: 2 m por pixel, limitada a 4096 pixels no lado maior
  const escM = Math.min(0.5, 4096 / Math.max(vx1 - vx0, vy1 - vy0, 1));
  const mascara = document.createElement('canvas');
  mascara.width  = Math.max(1, Math.ceil((vx1 - vx0) * escM));
  mascara.height = Math.max(1, Math.ceil((vy1 - vy0) * escM));
  const mctx = mascara.getContext('2d', { willReadFrequently: true });
  mctx.fillStyle = '#ffffff';
  mctx.fillRect(0, 0, mascara.width, mascara.height);
  const mx = x => (x - vx0) * escM;
  const my = y => (vy1 - y) * escM;
  // monta um caminho com todos os anéis das feições de uma camada
  function caminhoDe(camada) {
    const c = new Path2D();
    if (!camada) return c;
    for (const f of camada.features) {
      for (const pol of poligonosDe(f)) {
        for (const anel of pol) {
          anel.forEach(([x, y], i) => i === 0 ? c.moveTo(mx(x), my(y)) : c.lineTo(mx(x), my(y)));
          c.closePath();
        }
      }
    }
    return c;
  }
  mctx.fillStyle = mctx.strokeStyle = '#000000';
  mctx.fill(caminhoDe(agua), 'evenodd');
  const caminhoEdif = caminhoDe(edificacoes);
  mctx.fill(caminhoEdif, 'nonzero');
  mctx.lineWidth = Math.max(1, 2 * AFASTAMENTO_M * escM);   // folga dos dois lados do contorno
  mctx.stroke(caminhoEdif);
  // leito das vias de carro (piso vetorial): cada eixo é traçado com a sua
  // largura, para que nenhuma árvore caia no asfalto; a calçada fica livre
  mctx.lineCap = mctx.lineJoin = 'round';
  for (const f of eixos?.features ?? []) {
    const c = new Path2D();
    for (const linha of linhasDe(f)) {
      linha.forEach(([x, y], i) => i === 0 ? c.moveTo(mx(x), my(y)) : c.lineTo(mx(x), my(y)));
    }
    mctx.lineWidth = Math.max(1, f.properties.largura * escM);
    mctx.stroke(c);
  }
  const pixels = mctx.getImageData(0, 0, mascara.width, mascara.height).data;
  // devolve true se o ponto cai em área livre (pixel branco)
  function livre(x, y) {
    const c = Math.floor(mx(x)), r = Math.floor(my(y));
    if (c < 0 || r < 0 || c >= mascara.width || r >= mascara.height) return false;
    return pixels[(r * mascara.width + c) * 4] > 127;
  }

  // 5A.3 - Sorteio de posições: pontos ao acaso no retângulo envolvente de
  // cada polígono verde, mantidos só os que caem dentro dele e em área livre
  const pontos = [];           // folhosas
  const pontosPalmeira = [];   // palmeiras (só nas áreas grandes)
  for (const a of alvos) {
    const meta = Math.round(a.area / 10000 * densidade);
    let tentativas = 0;
    let aceitos = 0;
    while (aceitos < meta && tentativas < meta * 20) {
      tentativas++;
      const x = a.xmin + sortear01() * (a.xmax - a.xmin);
      const y = a.ymin + sortear01() * (a.ymax - a.ymin);
      if (livre(x, y) && pontoDentro(x, y, a.aneis)) {
        // nas áreas grandes, cada ponto vira palmeira com a probabilidade definida
        const palmeira = a.grande && sortear01() < PROPORCAO_PALMEIRAS;
        // [x, y, de rua, maciço]: os pontos das manchas viram maciços (item 10)
        (palmeira ? pontosPalmeira : pontos).push([x, y, false, true]);
        aceitos++;
      }
    }
  }
  // 5A.3.1 - Orla das lagoas: um ponto a cada ESPACAMENTO_ORLA_M ao longo do
  // contorno, empurrado para fora da água pela normal externa (que depende
  // do sentido do anel: anti-horário tem o interior à esquerda)
  for (const anel of lagoas) {
    let a2 = 0;
    for (let i = 0, j = anel.length - 1; i < anel.length; j = i++) {
      a2 += anel[j][0] * anel[i][1] - anel[i][0] * anel[j][1];
    }
    const antiHorario = a2 > 0;
    let d = 0;
    for (let i = 0; i < anel.length - 1; i++) {
      const [x0, y0] = anel[i], [x1, y1] = anel[i + 1];
      const comp = Math.hypot(x1 - x0, y1 - y0);
      if (comp < 1e-6) continue;
      const ux = (x1 - x0) / comp, uy = (y1 - y0) / comp;
      const nx = antiHorario ? uy : -uy, ny = antiHorario ? -ux : ux;   // para fora
      while (d < comp) {
        const af = AFASTAMENTO_ORLA_M * (0.7 + 0.6 * sortear01());
        const x = x0 + ux * d + nx * af, y = y0 + uy * d + ny * af;
        if (livre(x, y)) pontos.push([x, y]);
        d += ESPACAMENTO_ORLA_M;
      }
      d -= comp;   // o que sobra passa para o segmento seguinte
    }
  }

  pontos.push(...extrasXY);
  const n = pontos.length;
  const nPalmeiras = pontosPalmeira.length;
  if (n + nPalmeiras === 0) return { grupo, n: 0, nPalmeiras: 0 };

  // 5A.4 - Formas-base (item 10): copas em couve-flor (árvores isoladas) e
  // maciços (arvoredo), cada uma com a sua casca de contorno; bolota única
  // para a vista de longe; cilindro fino para o tronco (base em y = 0,
  // altura 1). Todas escaladas por árvore.
  const arranjosIsolados = [1, 2, 3].map(arranjoCouveFlor);
  const arranjosMacico   = [11, 12].map(arranjoMacico);
  const arranjos = [...arranjosIsolados, ...arranjosMacico];
  const geoCopa  = arranjos.map(l => geometriaCacho(l));
  const geoCasca = arranjos.map(l => geometriaCacho(l, CONTORNO_COPA));
  const geoLonge = geometriaCacho([[0, 0, 0, 1]]);
  const geoTronco = new THREE.CylinderGeometry(0.12, 0.16, 1, 5).translate(0, 0.5, 0);

  // sombreamento em faixas (toon): três tons fixos de luz, sem gradiente
  const tons = new Uint8Array(GRADIENTE_TOON.map(v => Math.round(v * 255)));
  const gradiente = new THREE.DataTexture(tons, tons.length, 1, THREE.RedFormat);
  gradiente.minFilter = gradiente.magFilter = THREE.NearestFilter;
  gradiente.generateMipmaps = false;
  gradiente.needsUpdate = true;
  const matCopa   = balancar(new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: gradiente }), true);
  const matCasca  = balancar(new THREE.MeshBasicMaterial({ color: COR_CONTORNO_COPA, side: THREE.BackSide }), true);
  const matTronco = balancar(new THREE.MeshStandardMaterial({ color: COR_TRONCO, roughness: 1 }));
  // as cascas e as copas usam chaves de cache próprias (a função balancar
  // dá a mesma chave a todos os materiais com tremor)
  matCopa.customProgramCacheKey  = () => 'balanco_tremor_toon';
  matCasca.customProgramCacheKey = () => 'balanco_tremor_casca';

  // sombras: uma elipse por árvore e por palmeira; o shader as desloca para o
  // lado oposto ao Sol, proporcionalmente à altura (guardada na escala Y)
  materialSombra = new THREE.MeshBasicMaterial({ color: '#1d2b26', transparent: true,
                                                 opacity: OPACIDADE_SOMBRA, depthWrite: false });
  materialSombra.customProgramCacheKey = () => 'sombra_arvore';
  materialSombra.onBeforeCompile = shader => {
    shader.uniforms.uSombra = deslocSombra;
    shader.vertexShader = 'uniform vec2 uSombra;\n' + shader.vertexShader.replace('#include <project_vertex>', `
      vec4 mvPosition = vec4( transformed, 1.0 );
      #ifdef USE_INSTANCING
        mvPosition = instanceMatrix * mvPosition;
        mvPosition.xz += uSombra * length(instanceMatrix[1].xyz) * 0.7;
      #endif
      mvPosition = modelViewMatrix * mvPosition;
      gl_Position = projectionMatrix * mvPosition;`);
  };
  const sombras = new THREE.InstancedMesh(new THREE.CircleGeometry(1, 14).rotateX(-Math.PI / 2),
                                          materialSombra, Math.max(n + nPalmeiras, 1));
  sombras.count = n + nPalmeiras;
  sombras.frustumCulled = false;

  // 5A.5 - Sorteio das medidas de cada árvore (h = altura total), guardado em
  // vetores para a montagem por bloco: copa com raio horizontal de 40% de h e
  // vertical de 30% de h, centrada a 70% de h; tronco até 50% de h, escondido
  // na base da copa. O resultado é uma copa larga e achatada.
  const H = new Float32Array(n), GIRO = new Float32Array(n), RX = new Float32Array(n), RZ = new Float32Array(n);
  const ARR = new Uint8Array(n), BLOCO = new Array(n);
  const COR = new Array(n);
  const T = TAMANHO_BLOCO_ARVORES_M;
  pontos.forEach(([x, y, rua, macico, hFixa, copaFixa], i) => {
    const [hmin, hmax] = rua ? ALTURA_ARVORE_RUA_M : ALTURA_ARVORE_M;
    H[i] = hmin + sortear01() * (hmax - hmin);
    GIRO[i] = sortear01() * Math.PI * 2;
    const largo = macico ? ESCALA_MACICO : 1;
    RX[i] = H[i] * 0.40 * largo * (0.85 + sortear01() * 0.3);
    RZ[i] = H[i] * 0.40 * largo * (0.85 + sortear01() * 0.3);
    ARR[i] = macico
      ? arranjosIsolados.length + Math.floor(sortear01() * arranjosMacico.length)
      : Math.floor(sortear01() * arranjosIsolados.length);
    COR[i] = new THREE.Color(CORES_COPA[Math.floor(sortear01() * CORES_COPA.length)])
      .offsetHSL(0, 0, VARIACAO_BRILHO_COPA * (2 * sortear01() - 1));
    // árvore indicada: medidas do arquivo; os sorteios acima são feitos mesmo
    // assim, para não alterar as demais árvores da sequência
    if (hFixa > 0) {
      H[i] = hFixa;
      RX[i] = RZ[i] = copaFixa > 0 ? copaFixa / (2 * RAIO_ARRANJO_COPA) : hFixa * 0.40;
    }
    BLOCO[i] = Math.floor(x / T) + ',' + Math.floor(y / T);
  });

  // 5A.5.0 - Montagem por bloco: em cada bloco, uma malha instanciada por
  // arranjo (copa e casca), uma de troncos e uma de bolotas da vista de longe.
  // Cada malha tem a sua esfera envolvente, de modo que o three.js deixa de
  // desenhar os blocos fora da tela.
  const grupoPerto = new THREE.Group(), grupoLonge = new THREE.Group(), grupoCasca = new THREE.Group();
  grupoPerto.add(grupoCasca);
  const porBloco = new Map();
  for (let i = 0; i < n; i++) {
    if (!porBloco.has(BLOCO[i])) porBloco.set(BLOCO[i], []);
    porBloco.get(BLOCO[i]).push(i);
  }
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const pos = new THREE.Vector3();
  const esc = new THREE.Vector3();
  const cor = new THREE.Color();
  const eixoY = new THREE.Vector3(0, 1, 0);
  const instanciada = (geo, mat, total) => { const im = new THREE.InstancedMesh(geo, mat, Math.max(total, 1)); im.count = total; return im; };
  for (const indices of porBloco.values()) {
    const contagem = arranjos.map(() => 0);
    for (const i of indices) contagem[ARR[i]]++;
    const copas  = contagem.map((c, a) => c ? instanciada(geoCopa[a], matCopa, c) : null);
    const cascas = contagem.map((c, a) => c ? instanciada(geoCasca[a], matCasca, c) : null);
    const troncos = instanciada(geoTronco, matTronco, indices.length);
    const longe   = instanciada(geoLonge, matCopa, indices.length);
    const cursor = arranjos.map(() => 0);
    indices.forEach((i, k) => {
      const [x, y] = pontos[i];
      const h = H[i];
      q.setFromAxisAngle(eixoY, GIRO[i]);
      m.compose(pos.set(x, 0, -y), q, esc.set(h * 0.6, h * 0.5, h * 0.6));
      troncos.setMatrixAt(k, m);
      m.compose(pos.set(x, h * 0.70, -y), q, esc.set(RX[i], h * 0.30, RZ[i]));
      const a = ARR[i], j = cursor[a]++;
      copas[a].setMatrixAt(j, m);
      copas[a].setColorAt(j, COR[i]);
      cascas[a].setMatrixAt(j, m);
      // de longe: uma bolota; o maciço fica mais largo que a copa isolada
      const largura = a >= arranjosIsolados.length ? 1.45 : 1;
      m.compose(pos.set(x, h * 0.70, -y), q, esc.set(RX[i] * largura, h * 0.32, RZ[i] * largura));
      longe.setMatrixAt(k, m);
      longe.setColorAt(k, COR[i]);
      // sombra: elipse do tamanho da copa (ou do maciço), com a altura na escala Y
      m.compose(pos.set(x, 0.05, -y), q, esc.set(RX[i] * 1.05 * largura, h, RZ[i] * 1.05 * largura));
      sombras.setMatrixAt(i, m);
    });
    for (const im of [...copas, ...cascas, troncos, longe]) {
      if (!im) continue;
      im.instanceMatrix.needsUpdate = true;
      if (im.instanceColor) im.instanceColor.needsUpdate = true;
      im.computeBoundingSphere();
    }
    grupoPerto.add(...copas.filter(Boolean), troncos);
    grupoCasca.add(...cascas.filter(Boolean));
    grupoLonge.add(longe);
  }
  grupoLonge.visible = false;
  grupo.add(grupoPerto, grupoLonge, sombras);

  // 5A.5.1 - Palmeiras: coroa de folhas arqueadas sobre estipe fino
  if (nPalmeiras > 0) {

    // forma da coroa, construída à mão: N_FOLHAS_PALMEIRA folhas em leque,
    // cada uma com dois triângulos (base estreita, meio erguido, ponta
    // caída), com raio 1 e origem no topo do estipe
    const vertices = [];
    for (let k = 0; k < N_FOLHAS_PALMEIRA; k++) {
      const a = (k / N_FOLHAS_PALMEIRA) * Math.PI * 2;
      const ca = Math.cos(a), sa = Math.sin(a);
      const px = -sa, pz = ca;                         // direção perpendicular à folha
      const larg = 0.13;                               // meia largura no meio da folha
      const ponta = 0.15 * (k % 2 ? 1 : -1);           // folhas alternadas mais altas e mais baixas
      const base = [0, 0.05, 0];
      const mE = [0.55 * ca + px * larg, 0.18, 0.55 * sa + pz * larg];
      const mD = [0.55 * ca - px * larg, 0.18, 0.55 * sa - pz * larg];
      const fim = [ca, -0.35 + ponta, sa];
      vertices.push(...base, ...mE, ...mD,   ...mE, ...fim, ...mD);
    }
    const geoCoroa = new THREE.BufferGeometry();
    geoCoroa.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
    geoCoroa.computeVertexNormals();
    const geoEstipe = new THREE.CylinderGeometry(0.035, 0.05, 1, 5).translate(0, 0.5, 0);

    // DoubleSide: as folhas são lâminas sem espessura, vistas dos dois lados
    const matCoroa  = balancar(new THREE.MeshStandardMaterial({ flatShading: true, roughness: 0.85, side: THREE.DoubleSide }));
    const matEstipe = balancar(new THREE.MeshStandardMaterial({ color: COR_ESTIPE, roughness: 1 }));
    const coroas  = new THREE.InstancedMesh(geoCoroa, matCoroa, nPalmeiras);
    const estipes = new THREE.InstancedMesh(geoEstipe, matEstipe, nPalmeiras);

    // estipe com a altura total; coroa no topo, com raio de 35% da altura e
    // altura proporcional, girada ao acaso
    const [pmin, pmax] = ALTURA_PALMEIRA_M;
    pontosPalmeira.forEach(([x, y], i) => {
      const h = pmin + sortear01() * (pmax - pmin);
      q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), sortear01() * Math.PI * 2);
      m.compose(pos.set(x, 0, -y), q, esc.set(h, h, h));
      estipes.setMatrixAt(i, m);
      const r = h * 0.35;
      m.compose(pos.set(x, h, -y), q, esc.set(r, r, r));
      coroas.setMatrixAt(i, m);
      m.compose(pos.set(x, 0.05, -y), q, esc.set(r * 0.8, h, r * 0.8));
      sombras.setMatrixAt(n + i, m);
      coroas.setColorAt(i, cor.set(CORES_PALMEIRA[Math.floor(sortear01() * CORES_PALMEIRA.length)]));
    });
    coroas.instanceMatrix.needsUpdate = true;
    estipes.instanceMatrix.needsUpdate = true;
    coroas.instanceColor.needsUpdate = true;
    grupo.add(coroas, estipes);
  }
  sombras.instanceMatrix.needsUpdate = true;

  // 5A.6 - Nível de detalhe: de perto, copas completas, troncos e contornos;
  // de longe, uma bolota por árvore (seção 2.6.4.1). Chamado a cada quadro.
  let contornos = true;
  function ajustarDetalhe(metrosPorPixel) {
    const perto = metrosPorPixel < LOD_ARVORES_MPP;
    grupoPerto.visible = perto;
    grupoLonge.visible = !perto;
    grupoCasca.visible = contornos;
  }
  function mostrarContornos(v) { contornos = v; grupoCasca.visible = v; }
