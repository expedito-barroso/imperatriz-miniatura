  return { grupo, n, nPalmeiras, ajustarDetalhe, mostrarContornos };
}


// -----------------------------------------------------------------------------
// 5B. - Nuvens: grupos de esferas facetadas sobre as bordas da maquete
// -----------------------------------------------------------------------------

function criarNuvens(lim, extensao) {
  const sortear01 = sorteador(SEMENTE_NUVENS);
  const grupo = new THREE.Group();
  const geo = new THREE.IcosahedronGeometry(1, 1);   // esfera low-poly
  const mat = new THREE.MeshStandardMaterial({
    color: '#ffffff', flatShading: true, roughness: 1,
    transparent: true, opacity: 0.92
  });
  const cx = (lim.xmin + lim.xmax) / 2, cy = (lim.ymin + lim.ymax) / 2;
  const [amin, amax] = ALTITUDE_NUVENS_M;

  for (let i = 0; i < N_NUVENS; i++) {
    // posição: ao redor do centro, a uma distância entre 45% e 75% da
    // extensão, de modo que fiquem sobre as bordas e não sobre a cidade
    const ang = sortear01() * Math.PI * 2;
    const r = extensao * (0.45 + sortear01() * 0.3);
    const nuvem = new THREE.Group();
    nuvem.position.set(cx + Math.cos(ang) * r,
                       amin + sortear01() * (amax - amin),
                       -(cy + Math.sin(ang) * r));

    // corpo: 5 a 8 esferas enfileiradas em x, achatadas em y
    const nEsferas = 5 + Math.floor(sortear01() * 4);
    const comprimento = 900 + sortear01() * 1100;
    for (let k = 0; k < nEsferas; k++) {
      const raio = 260 + sortear01() * 320;
      const bola = new THREE.Mesh(geo, mat);
      bola.position.set((k / (nEsferas - 1) - 0.5) * comprimento,
                        sortear01() * 150,
                        (sortear01() - 0.5) * 450);
      bola.scale.set(raio, raio * 0.65, raio);
      nuvem.add(bola);
    }
    grupo.add(nuvem);
  }

  // deriva: cada quadro, as nuvens andam para leste e reaparecem a oeste
  const xmin = lim.xmin - extensao * 0.3, xmax = lim.xmax + extensao * 0.3;
  function mover(dt) {
    for (const nuvem of grupo.children) {
      nuvem.position.x += VELOCIDADE_NUVENS * dt;
      if (nuvem.position.x > xmax) nuvem.position.x = xmin;
    }
  }
  return { grupo, mover };
}


// -----------------------------------------------------------------------------
// 5C. - Veículos: carros, caminhões e barcos em movimento
// -----------------------------------------------------------------------------

// 5C.1 - Formas: caixas coloridas fundidas numa geometria por tipo. A cor de
// cada parte (branco na carroceria, escuro nos vidros) é multiplicada pela
// cor de cada cópia, de modo que a carroceria assume a cor sorteada.
function caixa(comp, alt, larg, x, y, z, cor) {
  const g = new THREE.BoxGeometry(comp, alt, larg).translate(x, y, z);
  const c = new THREE.Color(cor);
  const cores = new Float32Array(g.attributes.position.count * 3);
  for (let i = 0; i < cores.length; i += 3) { cores[i] = c.r; cores[i + 1] = c.g; cores[i + 2] = c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(cores, 3));
  return g;
}

// comprimento ao longo de +X (sentido de marcha), altura em Y, largura em Z
const FORMAS_VEICULO = {
  carro: () => mergeGeometries([
    caixa(4.4, 0.9, 1.8,  0,    0.75, 0, '#ffffff'),    // carroceria
    caixa(2.3, 0.7, 1.6, -0.2,  1.5,  0, '#3a4552')     // cabine envidraçada
  ]),
  caminhao: () => mergeGeometries([
    caixa(11,  3.0, 2.5, -1.8,  2.0,  0, '#ffffff'),    // baú, na cor sorteada
    caixa(2.6, 2.6, 2.4,  5.2,  1.8,  0, '#d9dde0'),    // cabine
    caixa(0.2, 1.0, 2.0,  6.55, 2.3,  0, '#2d3540')     // para-brisa
  ]),
  barco: () => mergeGeometries([
    caixa(11,  1.2, 3.6,  0,    0.4,  0, '#ffffff'),    // casco
    caixa(3.6, 1.6, 2.6, -1.5,  1.8,  0, '#e9e6dc')     // cabine
  ])
};

// 5C.2 - Rede de trechos: cada eixo vira uma polilinha com comprimentos
// acumulados; as pontas dos trechos, arredondadas a 0,5 m, viram nós que
// ligam um trecho aos vizinhos
function chaveNo([x, y]) { return Math.round(x * 2) + '_' + Math.round(y * 2); }

function montarRede(features, classes) {
  const trechos = [];
  for (const f of features) {
    const p = f.properties ?? {};
    if (classes && !classes.includes(p.classe)) continue;
    for (const pts of linhasDe(f)) {
      if (pts.length < 2) continue;
      const acum = [0];
      for (let i = 1; i < pts.length; i++) {
        acum.push(acum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
      }
      const comp = acum[acum.length - 1];
      if (comp < 1) continue;
      trechos.push({ pts, acum, comp, classe: p.classe, maoUnica: Boolean(p.mao_unica),
                     largura: p.largura ?? 8, ini: chaveNo(pts[0]), fim: chaveNo(pts[pts.length - 1]) });
    }
  }
  const nos = new Map();
  trechos.forEach((t, i) => {
    for (const [chave, ponta] of [[t.ini, 'ini'], [t.fim, 'fim']]) {
      if (!nos.has(chave)) nos.set(chave, []);
      nos.get(chave).push({ i, ponta });
    }
  });
  const total = trechos.reduce((s, t) => s + t.comp, 0);
  return { trechos, nos, total };
}

// ponto e direção a uma distância d do início da polilinha
function pontoEm(t, d) {
  const { pts, acum } = t;
  let lo = 0, hi = acum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (acum[m] <= d) lo = m; else hi = m; }
  const seg = acum[hi] - acum[lo] || 1;
  const f = Math.min(Math.max((d - acum[lo]) / seg, 0), 1);
  const [x0, y0] = pts[lo], [x1, y1] = pts[hi];
  return [x0 + (x1 - x0) * f, y0 + (y1 - y0) * f, (x1 - x0) / seg, (y1 - y0) / seg];
}

// 5C.3 - Frota de um tipo: uma InstancedMesh e o estado de cada veículo
function criarFrota(rede, n, forma, cores, velocidades, sortear01, opcoes = {}) {
  if (!rede || rede.trechos.length === 0 || n === 0) return null;
  const malha = new THREE.InstancedMesh(forma(),
    new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.6 }), n);
  malha.frustumCulled = false;   // as cópias andam por toda a cena

  // sorteio de um trecho com probabilidade proporcional ao comprimento
  function trechoAoAcaso() {
    let r = sortear01() * rede.total;
    for (let i = 0; i < rede.trechos.length; i++) { r -= rede.trechos[i].comp; if (r <= 0) return i; }
    return rede.trechos.length - 1;
  }
  function iniciar(v) {
    v.i = trechoAoAcaso();
    const t = rede.trechos[v.i];
    v.sentido = t.maoUnica ? 1 : (sortear01() < 0.5 ? 1 : -1);
    v.s = sortear01() * t.comp;
    v.faixa = sortear01() < 0.5 ? -1 : 1;    // faixa usada nas vias de mão única largas
  }

  const veiculos = [];
  const cor = new THREE.Color();
  for (let k = 0; k < n; k++) {
    const v = { vel: velocidades[0] + sortear01() * (velocidades[1] - velocidades[0]),
                desvio: (sortear01() * 2 - 1) * (opcoes.desvio ?? 0) };
    iniciar(v);
    veiculos.push(v);
    malha.setColorAt(k, cor.set(cores[Math.floor(sortear01() * cores.length)]));
  }

  // ao fim de um trecho: segue para um trecho ligado ao nó de chegada,
  // de preferência da mesma classe; mão única só pela ponta inicial;
  // sem saída, faz o retorno (mão dupla) ou reaparece em outro ponto
  function proximo(v) {
    const t = rede.trechos[v.i];
    const no = v.sentido > 0 ? t.fim : t.ini;
    const opcoesNo = (rede.nos.get(no) ?? []).filter(o => o.i !== v.i &&
      !(rede.trechos[o.i].maoUnica && o.ponta === 'fim'));
    const mesmaClasse = opcoesNo.filter(o => rede.trechos[o.i].classe === t.classe);
    const lista = mesmaClasse.length ? mesmaClasse : opcoesNo;
    if (lista.length) {
      const o = lista[Math.floor(sortear01() * lista.length)];
      v.i = o.i; v.sentido = o.ponta === 'ini' ? 1 : -1; v.s = 0;
    } else if (!t.maoUnica) {
      v.sentido = -v.sentido; v.s = 0;
    } else {
      iniciar(v); v.s = 0;
    }
  }

  const obj = new THREE.Object3D();
  obj.scale.setScalar(opcoes.escala ?? 1);
  function mover(dt) {
    for (let k = 0; k < n; k++) {
      const v = veiculos[k];
      v.s += v.vel * dt;
      let guarda = 0;
      while (v.s > rede.trechos[v.i].comp && guarda++ < 5) {
        const sobra = v.s - rede.trechos[v.i].comp;
        proximo(v);
        v.s = Math.min(sobra, rede.trechos[v.i].comp);
      }
      const t = rede.trechos[v.i];
      const d = v.sentido > 0 ? v.s : t.comp - v.s;
      const [x, y, ux0, uy0] = pontoEm(t, d);
      const ux = ux0 * v.sentido, uy = uy0 * v.sentido;
      // deslocamento lateral: mão dupla, pela direita (um quarto da largura);
      // mão única larga, numa das duas faixas; barcos, desvio fixo do eixo
      let lado = v.desvio;
      if (!opcoes.desvio) {
        lado = t.maoUnica ? (t.largura >= 6 ? v.faixa * t.largura / 4 : 0) : t.largura / 4;
      }
      obj.position.set(x + uy * lado, 0, -(y - ux * lado));
      obj.rotation.set(0, Math.atan2(uy, ux), 0);
      obj.updateMatrix();
      malha.setMatrixAt(k, obj.matrix);
    }
    malha.instanceMatrix.needsUpdate = true;
  }
  mover(0);
  return { malha, mover, n };
}

// 5C.3.1 - Barcos sem rota: cada barco vai em linha reta até um ponto
// sorteado na água, a 0,8 a 3,3 km de distância, desde que o trajeto inteiro
// fique na água (conferido a cada 40 m); ao chegar, sorteia outro destino
function criarBarcosLivres(aneis, n, forma, cores, velocidades, sortear01, escala) {
  let xmin = Infinity, ymin = Infinity, xmax = -Infinity, ymax = -Infinity;
  for (const [x, y] of aneis[0]) {
    xmin = Math.min(xmin, x); xmax = Math.max(xmax, x);
    ymin = Math.min(ymin, y); ymax = Math.max(ymax, y);
  }
  const naAgua = (x, y) => pontoDentro(x, y, aneis);
  function trajetoNaAgua(xa, ya, xb, yb) {
    const passos = Math.ceil(Math.hypot(xb - xa, yb - ya) / 40);
    for (let i = 1; i <= passos; i++) {
      const t = i / passos;
      if (!naAgua(xa + (xb - xa) * t, ya + (yb - ya) * t)) return false;
    }
    return true;
  }
  function novoDestino(b) {
    for (let t = 0; t < 40; t++) {
      const ang = sortear01() * 2 * Math.PI, r = 800 + sortear01() * 2500;
      const x = b.x + Math.cos(ang) * r, y = b.y + Math.sin(ang) * r;
      if (naAgua(x, y) && trajetoNaAgua(b.x, b.y, x, y)) { b.ax = x; b.ay = y; return; }
    }
    b.espera = 2;   // sem destino possível agora; tenta de novo em 2 s
  }

  const barcos = [];
  for (let k = 0; k < n; k++) {
    for (let t = 0; t < 500; t++) {
      const x = xmin + sortear01() * (xmax - xmin), y = ymin + sortear01() * (ymax - ymin);
      if (naAgua(x, y)) {
        const b = { x, y, ax: x, ay: y, rumo: 0, espera: 0,
                    vel: velocidades[0] + sortear01() * (velocidades[1] - velocidades[0]) };
        novoDestino(b);
        barcos.push(b);
        break;
      }
    }
  }
  if (barcos.length === 0) return null;

  const malha = new THREE.InstancedMesh(forma(),
    new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.6 }), barcos.length);
  malha.frustumCulled = false;
  const cor = new THREE.Color();
  barcos.forEach((b, k) => malha.setColorAt(k, cor.set(cores[Math.floor(sortear01() * cores.length)])));
  const obj = new THREE.Object3D();
  obj.scale.setScalar(escala);

  function mover(dt) {
    barcos.forEach((b, k) => {
      if (b.espera > 0) { b.espera -= dt; if (b.espera <= 0) novoDestino(b); }
      const dx = b.ax - b.x, dy = b.ay - b.y, dist = Math.hypot(dx, dy);
      const passo = b.vel * dt;
      if (dist <= passo) { b.x = b.ax; b.y = b.ay; if (b.espera <= 0) novoDestino(b); }
      else { b.x += dx / dist * passo; b.y += dy / dist * passo; b.rumo = Math.atan2(dy, dx); }
      obj.position.set(b.x, 0, -b.y);
      obj.rotation.set(0, b.rumo, 0);
      obj.updateMatrix();
      malha.setMatrixAt(k, obj.matrix);
    });
    malha.instanceMatrix.needsUpdate = true;
  }
  mover(0);
  return { malha, mover, n: barcos.length };
}

// 5C.3.2 - Avião: forma e ciclo de pouso e decolagem
function criarAviao(pistas, escala) {
  // pista de pouso mais longa; as pontas definem o eixo (A -> B no pouso)
  let melhor = null, compMelhor = 0;
  for (const f of pistas?.features ?? []) {
    if (f.properties?.tipo !== 'runway') continue;
    for (const pts of linhasDe(f)) {
      const a = pts[0], b = pts[pts.length - 1];
      const c = Math.hypot(b[0] - a[0], b[1] - a[1]);
      if (c > compMelhor) { compMelhor = c; melhor = [a, b]; }
    }
  }
  if (!melhor || compMelhor < 800) return null;
  const [[ax, ay], [bx, by]] = melhor;
  const ux = (bx - ax) / compMelhor, uy = (by - ay) / compMelhor;
  const rumoPouso = Math.atan2(uy, ux);

  // forma: fuselagem, asas, estabilizadores e deriva (jato regional, ~35 m)
  const forma = mergeGeometries([
    caixa(34,  3.6, 3.6,   0,    3.2,  0,   '#f4f4f0'),   // fuselagem
    caixa(3,   2.4, 3.0,  18,    3.0,  0,   '#f4f4f0'),   // nariz
    caixa(5,   0.5, 34,    1,    2.6,  0,   '#dfe3e6'),   // asas
    caixa(3,   0.4, 12,  -15,    4.6,  0,   '#dfe3e6'),   // estabilizador horizontal
    caixa(4,   6.0, 0.5, -15,    7.5,  0,   '#2f5d8c'),   // deriva (cauda azul)
    caixa(3.5, 1.6, 1.8,   2,    1.6,  6,   '#9aa3aa'),   // motor direito
    caixa(3.5, 1.6, 1.8,   2,    1.6, -6,   '#9aa3aa')    // motor esquerdo
  ]);
  const malha = new THREE.Mesh(forma,
    new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.5 }));
  malha.scale.setScalar(escala);
  malha.rotation.order = 'YZX';   // primeiro o rumo, depois o nariz para cima ou para baixo

  // pontos do ciclo, em metros ao longo do eixo a partir de A
  const toque  = 300;                               // toque a 300 m da cabeceira A
  const parada = compMelhor - 300;                  // fim da corrida, 300 m antes de B
  const hAprox = AVIAO_DIST_APROX_M * Math.tan(THREE.MathUtils.degToRad(AVIAO_RAMPA_GRAUS));
  const vP = AVIAO_VEL_POUSO_MS, vD = AVIAO_VEL_DECOLAGEM_MS;
  const corrida  = parada - toque;
  const tAprox   = AVIAO_DIST_APROX_M / vP;
  const tCorrida = 2 * corrida / vP;                // desaceleração uniforme até parar
  const corridaDec = Math.min(1500, parada - 100);  // corrida de decolagem, de B para A
  const tDec     = 2 * corridaDec / vD;
  const subidaM  = AVIAO_DIST_APROX_M;
  const tSubida  = subidaM / vD;
  const fases = [tAprox, tCorrida, AVIAO_PAUSA_S, tDec, tSubida, AVIAO_INTERVALO_S];
  const ciclo = fases.reduce((a, b) => a + b, 0);
  const tanSubida = Math.tan(THREE.MathUtils.degToRad(AVIAO_SUBIDA_GRAUS));
  let t = 0;

  // posição a s metros de A ao longo do eixo, na altura h
  function colocar(s, h, rumo, arfagem) {
    malha.position.set(ax + ux * s, h, -(ay + uy * s));
    malha.rotation.set(0, rumo, arfagem);
  }

  function mover(dt) {
    t = (t + dt) % ciclo;
    let r = t;
    malha.visible = true;
    if (r < fases[0]) {                                   // aproximação
      const f = r / fases[0];
      colocar(toque - AVIAO_DIST_APROX_M * (1 - f), hAprox * (1 - f), rumoPouso, 0.03);
      return;
    }
    r -= fases[0];
    if (r < fases[1]) {                                   // toque e corrida
      const a = vP / fases[1];
      colocar(toque + vP * r - 0.5 * a * r * r, 0, rumoPouso, 0);
      return;
    }
    r -= fases[1];
    if (r < fases[2]) {                                   // meia-volta na cabeceira
      colocar(parada, 0, rumoPouso + Math.PI * Math.min(1, r / (fases[2] * 0.6)), 0);
      return;
    }
    r -= fases[2];
    const rumoDec = rumoPouso + Math.PI;
    if (r < fases[3]) {                                   // corrida de decolagem
      const a = vD / fases[3];
      colocar(parada - 0.5 * a * r * r, 0, rumoDec, 0);
      return;
    }
    r -= fases[3];
    if (r < fases[4]) {                                   // subida
      const d = vD * r;
      colocar(parada - corridaDec - d, d * tanSubida, rumoDec, THREE.MathUtils.degToRad(AVIAO_SUBIDA_GRAUS));
      return;
    }
    malha.visible = false;                                // intervalo fora de vista
  }
  mover(0);
  return { malha, mover, n: 1 };
}

// 5C.4 - Todas as frotas
function criarVeiculos(dados) {
  const grupo = new THREE.Group();
  const frotas = [];
  const sortear01 = sorteador(SEMENTE_VEICULOS);
  const eixos = dados.eixos?.features ?? [];

  const redeCarros = montarRede(eixos, CLASSES_CARROS);
  let redeCaminhoes = montarRede(eixos, CLASSES_CAMINHOES);
  if (redeCaminhoes.trechos.length === 0) redeCaminhoes = montarRede(eixos, ['primary']);
  const redeRio = dados.rio ? montarRede(dados.rio.features, null) : null;
  // no rio não há mão única nem largura de via: o desvio lateral é fixo por barco
  if (redeRio) redeRio.trechos.forEach(t => { t.maoUnica = false; });

  // sem a camada do rio (script 03 anterior a 03/11/2026), os barcos navegam
  // livremente dentro da maior parte da água (o Tocantins)
  let barcosLivres = null;
  if (!redeRio && dados.agua) {
    let maior = null, areaMaior = 0;
    for (const f of dados.agua.features) {
      for (const aneis of poligonosDe(f)) {
        const a = areaAnel(aneis[0]);
        if (a > areaMaior) { areaMaior = a; maior = aneis; }
      }
    }
    if (maior) barcosLivres = criarBarcosLivres(maior, N_BARCOS, FORMAS_VEICULO.barco, CORES_BARCOS,
                                                VELOCIDADE_BARCO_MS, sortear01, ESCALA_VEICULOS);
  }

  const aviao = criarAviao(dados.pistas, ESCALA_VEICULOS);
  for (const frota of [
    aviao,
    barcosLivres,
    criarFrota(redeCarros,    N_CARROS,    FORMAS_VEICULO.carro,    CORES_CARROS, VELOCIDADE_CARRO_MS,    sortear01, { escala: ESCALA_VEICULOS }),
    criarFrota(redeCaminhoes, N_CAMINHOES, FORMAS_VEICULO.caminhao, CORES_CARGAS, VELOCIDADE_CAMINHAO_MS, sortear01, { escala: ESCALA_VEICULOS }),
    criarFrota(redeRio,       N_BARCOS,    FORMAS_VEICULO.barco,    CORES_BARCOS, VELOCIDADE_BARCO_MS,    sortear01, { escala: ESCALA_VEICULOS, desvio: DESVIO_BARCO_M })
  ]) {
    if (frota) { grupo.add(frota.malha); frotas.push(frota); }
  }
  return {
    grupo,
    aviao,
    contagem: frotas.map(f => f.n),
    mover: dt => { for (const f of frotas) f.mover(dt * ESCALA_TEMPO); }
  };
}


// -----------------------------------------------------------------------------
// 5D. - Pixel art: desenho em resolução baixa, paleta reduzida e contorno
// -----------------------------------------------------------------------------

// A cena é desenhada num alvo de renderização FATOR_PIXEL vezes menor que a
// tela, com textura de profundidade; um retângulo de tela cheia lê esse alvo
// sem suavização, converte para sRGB, reduz as cores com pontilhado de Bayer e
// escurece as bordas onde a profundidade salta. A câmera é ortográfica, então a
// profundidade gravada já é linear entre near e far.
function criarPixelArt(renderer, vista) {
  let fator = FATOR_PIXEL;
  const tamanho = () => [Math.max(1, Math.floor(window.innerWidth / fator)),
                         Math.max(1, Math.floor(window.innerHeight / fator))];
  const [w, h] = tamanho();
  const alvo = new THREE.WebGLRenderTarget(w, h, {
    minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
    depthTexture: new THREE.DepthTexture(w, h)
  });
  alvo.depthTexture.minFilter = alvo.depthTexture.magFilter = THREE.NearestFilter;

  const material = new THREE.ShaderMaterial({
    uniforms: {
      tCor:   { value: alvo.texture },
      tProf:  { value: alvo.depthTexture },
      uRes:   { value: new THREE.Vector2(w, h) },
      uNear:  { value: 1 },
      uFar:   { value: 1000 },
      uPersp: { value: 0 },
      uAlfa:  { value: 1 },
      uSalto: { value: SALTO_CONTORNO_M },
      uNiveis:{ value: NIVEIS_COR }
    },
    vertexShader: `
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: `
      uniform sampler2D tCor; uniform sampler2D tProf;
      uniform vec2 uRes; uniform float uNear, uFar, uSalto, uNiveis, uPersp, uAlfa;
      varying vec2 vUv;
      // profundidade em metros: linear na câmera ortográfica; na perspectiva,
      // o valor gravado é convertido de volta para a distância
      float prof(vec2 uv) {
        float z = texture2D(tProf, uv).x;
        if (uPersp > 0.5) return 2.0 * uNear * uFar / (uFar + uNear - (2.0 * z - 1.0) * (uFar - uNear));
        return mix(uNear, uFar, z);
      }
      float bayer(vec2 p) {
        int x = int(mod(p.x, 4.0)), y = int(mod(p.y, 4.0));
        float m[16] = float[16](0., 8., 2., 10., 12., 4., 14., 6., 3., 11., 1., 9., 15., 7., 13., 5.);
        return m[x + y * 4] / 16.0 - 0.5;
      }
      void main() {
        vec2 px = floor(vUv * uRes);
        vec2 uv = (px + 0.5) / uRes;
        vec3 c = texture2D(tCor, uv).rgb;
        // linear -> sRGB (o alvo de renderização guarda cores lineares)
        c = mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
        // contorno: este pixel está à frente de um vizinho por mais de uSalto metros
        float d = prof(uv);
        vec2 e = 1.0 / uRes;
        float salto = max(max(prof(uv + vec2(e.x, 0.0)), prof(uv - vec2(e.x, 0.0))),
                          max(prof(uv + vec2(0.0, e.y)), prof(uv - vec2(0.0, e.y)))) - d;
        // na perspectiva, o limiar cresce com a distância (2% dela): de longe,
        // um pixel de chão já cobre vários metros de profundidade
        if (salto > uSalto + uPersp * d * 0.02) c *= 0.45;
        // paleta reduzida com pontilhado regular
        float n = uNiveis - 1.0;
        c = floor(c * n + 0.5 + bayer(px) * 0.9) / n;
        gl_FragColor = vec4(clamp(c, 0.0, 1.0), uAlfa);
      }`,
    depthTest: false, depthWrite: false, transparent: true
  });
  const quadCena = new THREE.Scene();
  quadCena.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));
  const quadCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

  return {
    // alfa = 1: só o pixel art; entre 0 e 1: a cena normal já desenhada na
    // tela recebe o pixel art por cima, com essa opacidade (transição do
    // modo "ao aproximar")
    desenhar(cena, alfa = 1) {
      const camera = vista.camera;
      const u = material.uniforms;
      u.uNear.value = camera.near;
      u.uFar.value = camera.far;
      u.uPersp.value = camera.isPerspectiveCamera ? 1 : 0;
      u.uAlfa.value = alfa;
      renderer.setRenderTarget(alvo);
      renderer.render(cena, camera);
      renderer.setRenderTarget(null);
      const limpar = renderer.autoClear;
      renderer.autoClear = alfa >= 1;
      renderer.render(quadCena, quadCamera);
      renderer.autoClear = limpar;
    },
    redimensionar(novoFator = fator) {
      fator = novoFator;
      const [w2, h2] = tamanho();
      alvo.setSize(w2, h2);
      material.uniforms.uRes.value.set(w2, h2);
    }
  };
}

// 5E. - Identificação de uma edificação por duplo clique
// -----------------------------------------------------------------------------

// 5E.1 - UTM -> latitude e longitude (elipsoide GRS80 do SIRGAS 2000;
// fórmulas inversas da projeção transversa de Mercator, Snyder 1987)
function utmParaGeo(E, N, fuso, sul) {
  const a = 6378137, f = 1 / 298.257222101, k0 = 0.9996;
  const e2 = f * (2 - f), ep2 = e2 / (1 - e2);
  const x = E - 500000, y = sul ? N - 10000000 : N;
  const mu = y / k0 / (a * (1 - e2 / 4 - 3 * e2 ** 2 / 64 - 5 * e2 ** 3 / 256));
  const e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
  const f1 = mu + (3 * e1 / 2 - 27 * e1 ** 3 / 32) * Math.sin(2 * mu)
               + (21 * e1 ** 2 / 16 - 55 * e1 ** 4 / 32) * Math.sin(4 * mu)
               + (151 * e1 ** 3 / 96) * Math.sin(6 * mu) + (1097 * e1 ** 4 / 512) * Math.sin(8 * mu);
  const s = Math.sin(f1), c = Math.cos(f1), t = Math.tan(f1);
  const C1 = ep2 * c * c, T1 = t * t;
  const N1 = a / Math.sqrt(1 - e2 * s * s), R1 = a * (1 - e2) / (1 - e2 * s * s) ** 1.5;
  const D = x / (N1 * k0);
  const lat = f1 - (N1 * t / R1) * (D ** 2 / 2 - (5 + 3 * T1 + 10 * C1 - 4 * C1 ** 2 - 9 * ep2) * D ** 4 / 24
              + (61 + 90 * T1 + 298 * C1 + 45 * T1 ** 2 - 252 * ep2 - 3 * C1 ** 2) * D ** 6 / 720);
  const lon = (fuso * 6 - 183) * Math.PI / 180
              + (D - (1 + 2 * T1 + C1) * D ** 3 / 6
                 + (5 - 2 * C1 + 28 * T1 - 3 * C1 ** 2 + 8 * ep2 + 24 * T1 ** 2) * D ** 5 / 120) / c;
  return [lat * 180 / Math.PI, lon * 180 / Math.PI];
}

// 5E.2 - Do clique à edificação: o raio da câmera desce em passos de 0,5 m
// de altura, do topo da edificação mais alta até o chão; a primeira
// edificação cujo contorno contém o ponto e cuja altura (com o exagero
// vertical) o alcança é a que se vê no clique. Mostra a caixa e um marcador.
// 5E.1.1 - Bairro e via mais próxima de um ponto (versão 1.1.0), a partir dos
// nomes do OSM: bairro = polígono que contém o ponto; sem polígonos, o ponto
// de bairro mais próximo (até 3 km, marcado como aproximado); via = eixo com
// nome mais próximo (até 80 m)
function criarLocalizador(dados) {
  const vias = [];
  for (const f of dados.eixos?.features ?? []) {
    const nome = f.properties?.nome;
    if (!nome) continue;
    for (const linha of linhasDe(f)) vias.push({ nome, linha });
  }
  const bairros = (dados.bairros?.features ?? []).filter(f => f.properties?.nome);
  const pontosBairro = (dados.bairros_pontos?.features ?? []).filter(f => f.properties?.nome && f.geometry?.type === 'Point');
  function viaProxima(x, y) {
    let melhor = null, dMin = 80;
    for (const { nome, linha } of vias) {
      for (let i = 0; i < linha.length - 1; i++) {
        const [x0, y0] = linha[i], [x1, y1] = linha[i + 1];
        if (Math.min(x0, x1) - dMin > x || Math.max(x0, x1) + dMin < x ||
            Math.min(y0, y1) - dMin > y || Math.max(y0, y1) + dMin < y) continue;
        const dx = x1 - x0, dy = y1 - y0, l2 = dx * dx + dy * dy || 1;
        const t = Math.max(0, Math.min(1, ((x - x0) * dx + (y - y0) * dy) / l2));
        const d = Math.hypot(x - x0 - t * dx, y - y0 - t * dy);
        if (d < dMin) { dMin = d; melhor = nome; }
      }
    }
    return melhor;
  }
  function bairro(x, y) {
    for (const f of bairros) {
      for (const aneis of poligonosDe(f)) if (pontoDentro(x, y, aneis)) return f.properties.nome;
    }
    let melhor = null, dMin = 3000;
    for (const f of pontosBairro) {
      const [px, py] = f.geometry.coordinates;
      const d = Math.hypot(px - x, py - y);
      if (d < dMin) { dMin = d; melhor = f.properties.nome; }
    }
    return melhor ? melhor + ' (aprox.)' : null;
  }
  return { viaProxima, bairro };
}

function criarIdentificacao(cena, vista, renderer, edificacoes, edificacaoEm, hMax, metadados, localizador) {
  const caixa = document.getElementById('identificacao');
  const raio = new THREE.Raycaster(), ndc = new THREE.Vector2();
  const origem = metadados?.origem_utm ?? null;
  // fuso a partir do código EPSG do SIRGAS 2000 / UTM sul (31978 = 18S ... 31985 = 25S)
  const codigo = parseInt(String(metadados?.crs_origem ?? 'EPSG:31983').split(':')[1], 10);
  const fuso = codigo - 31960;

  const marcador = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 1, 8).translate(0, 0.5, 0),
                                  new THREE.MeshBasicMaterial({ color: '#ffd166' }));
  marcador.visible = false;
  cena.add(marcador);

  function fechar() { caixa.hidden = true; marcador.visible = false; }
  window.addEventListener('keydown', e => { if (e.key === 'Escape') fechar(); });

  return function (evento) {
    ndc.set(evento.clientX / window.innerWidth * 2 - 1, -(evento.clientY / window.innerHeight) * 2 + 1);
    raio.setFromCamera(ndc, vista.camera);
    const o = raio.ray.origin, d = raio.ray.direction;
    if (d.y >= 0) return;
    const exag = edificacoes.scale.y;
    const t0 = (hMax * exag + 1 - o.y) / d.y, t1 = -o.y / d.y, passo = 0.5 / Math.abs(d.y);
    let achada = null, cx = 0, cy = 0;
    for (let t = t0; t <= t1 && !achada; t += passo) {
      const x = o.x + d.x * t, y = o.y + d.y * t, z = o.z + d.z * t;
      achada = edificacaoEm(x, -z, y / exag);
      if (achada) { cx = x; cy = -z; }
    }
    if (!achada) { fechar(); return; }

    // as coordenadas são as do ponto clicado, que fica sempre dentro do
    // contorno (o centro de um contorno em L pode cair fora dele)
    const { p } = achada;
    let linhaGeo = 'Coordenadas: origem UTM ausente em metadados_cena.json';
    let links = '';
    if (origem) {
      const E = cx + origem.x, N = cy + origem.y;
      const [lat, lon] = utmParaGeo(E, N, fuso, true);
      const ll = `${lat.toFixed(6)},${lon.toFixed(6)}`;
      linhaGeo = `Lat, lon: ${lat.toFixed(6)}, ${lon.toFixed(6)}<br>UTM ${fuso}S: ${E.toFixed(0)} E, ${N.toFixed(0)} N`;
      links = `<br><a href="https://www.google.com/maps/search/?api=1&query=${ll}" target="_blank" rel="noopener">Google Maps</a>` +
              ` · <a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${ll}" target="_blank" rel="noopener">Street View</a>`;
      window.ultimaEdificacao = { id: p.id, tipo: p.tipo, pav: p.pav, h_cena: p.h_cena, lat, lon, utm_e: E, utm_n: N };
    }
    // bairro e via (nomes do OSM), quando houver
    const nomeBairro = localizador?.bairro(cx, cy);
    const nomeVia = localizador?.viaProxima(cx, cy);
    const linhaLugar = (nomeBairro ? `Bairro: ${nomeBairro}<br>` : '') +
                       (nomeVia ? `Via mais próxima: ${nomeVia}<br>` : '');
    caixa.innerHTML = `<span class="fechar" title="Fechar (Esc)">✕</span>` +
      `<b>Edificação ${p.id}</b><br>` + linhaLugar +
      `Classe: ${p.tipo} · ${p.pav} pavimento(s)${p.imputado ? ' (altura imputada)' : ''}<br>` +
      `Altura na cena: ${p.h_cena} m, sem o exagero vertical<br>${linhaGeo}${links}`;
    caixa.hidden = false;
    caixa.style.left = Math.min(evento.clientX + 14, window.innerWidth - 320) + 'px';
    caixa.style.top  = Math.min(evento.clientY + 14, window.innerHeight - 160) + 'px';
    caixa.querySelector('.fechar').addEventListener('click', fechar);

    // marcador amarelo sobre o ponto clicado
    marcador.position.set(cx, p.h_cena * exag, -cy);
    marcador.scale.set(1, 12, 1);
    marcador.visible = true;
  };
}


// -----------------------------------------------------------------------------
// 5F. - Brasões nas fachadas
// -----------------------------------------------------------------------------

function criarBrasoes(cena, renderer, edificacaoEm, metadados, eixos) {
  const placas = [];
  const origem = metadados?.origem_utm;
  if (!origem) return { atualizar: () => {} };
  const carregador = new THREE.TextureLoader();

  // distância de um ponto (x, y) ao eixo de via mais próximo
  function distVia(x, y) {
    let melhor = Infinity;
    for (const f of eixos?.features ?? []) {
      for (const linha of linhasDe(f)) {
        for (let i = 0; i < linha.length - 1; i++) {
          const [x0, y0] = linha[i], [x1, y1] = linha[i + 1];
          const dx = x1 - x0, dy = y1 - y0, l2 = dx * dx + dy * dy || 1;
          const t = Math.max(0, Math.min(1, ((x - x0) * dx + (y - y0) * dy) / l2));
          melhor = Math.min(melhor, Math.hypot(x - x0 - t * dx, y - y0 - t * dy));
        }
      }
    }
    return melhor;
  }

  for (const b of BRASOES) {
    // 5F.1 - Edificação que contém o ponto ou, se ele cair fora de todas
    // (contorno em L), a mais próxima dele até 30 m
    const x = b.utm_e - origem.x, y = b.utm_n - origem.y;
    const ed = edificacaoEm(x, y);
    if (!ed) { console.warn(`Brasão ${b.nome}: nenhuma edificação até 30 m do ponto indicado.`); continue; }
    const anel = ed.anel;

    // 5F.2 - Paredes com a normal para fora (anel anti-horário: interior à esquerda)
    let a2 = 0;
    for (let i = 0, j = anel.length - 1; i < anel.length; j = i++) a2 += anel[j][0] * anel[i][1] - anel[i][0] * anel[j][1];
    const sinal = a2 > 0 ? 1 : -1;
    const paredes = anel.map((p0, i) => {
      const p1 = anel[(i + 1) % anel.length];
      const comp = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]) || 1;
      const nx = sinal * (p1[1] - p0[1]) / comp, ny = -sinal * (p1[0] - p0[0]) / comp;
      const mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2;
      return { comp, nx, ny, mx, my };
    }).filter(w => w.comp >= 3);

    // 5F.3 - Escolha da parede: voltada para a rua ou a mais longa
    let parede;
    if (b.parede === 'rua' && eixos) {
      parede = paredes.reduce((m, w) => {
        const d = distVia(w.mx + w.nx * 3, w.my + w.ny * 3) - 0.02 * w.comp;   // desempate pela largura
        return (!m || d < m.d) ? { ...w, d } : m;
      }, null);
    } else {
      parede = paredes.reduce((m, w) => (!m || w.comp > m.comp) ? w : m, null);
    }
    if (!parede) continue;

    // 5F.4 - Placa com a textura, 15 cm à frente da parede, girada para fora
    const material = new THREE.MeshStandardMaterial({ transparent: true, alphaTest: 0.05, roughness: 0.8 });
    const malha = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), material);
    malha.rotation.y = Math.atan2(parede.nx, -parede.ny);
    malha.visible = false;
    cena.add(malha);
    const placa = { malha, parede, h: ed.p.h_cena, b, aspecto: 1 };
    placas.push(placa);
    carregador.load(b.imagem, textura => {
      textura.colorSpace = THREE.SRGBColorSpace;
      textura.anisotropy = renderer.capabilities.getMaxAnisotropy();
      material.map = textura;
      material.needsUpdate = true;
      placa.aspecto = textura.image.height / textura.image.width;
      malha.visible = true;
      atualizar(placa.exag ?? EXAGERO_INICIAL);
    }, undefined, () => console.warn(`Brasão ${b.nome}: imagem ${b.imagem} não encontrada em web/.`));
  }

  // 5F.5 - Tamanho e altura conforme o exagero vertical (proporções mantidas)
  function atualizar(exag) {
    for (const pl of placas) {
      pl.exag = exag;
      const hVis = pl.h * exag;
      const larg = Math.min(pl.parede.comp * pl.b.largura_rel, hVis * pl.b.altura_rel / pl.aspecto);
      const alt = larg * pl.aspecto;
      pl.malha.scale.set(larg, alt, 1);
      pl.malha.position.set(pl.parede.mx + pl.parede.nx * 0.15, hVis * 0.5, -(pl.parede.my + pl.parede.ny * 0.15));
    }
  }
  return { atualizar, placas };
}


// -----------------------------------------------------------------------------
// 6. - Cena, câmera, luzes e controles
// -----------------------------------------------------------------------------

async function principal() {

  // 6.1 - Leitura dos dados
  await avisar('Lendo as camadas da cena…');
  const dados = {};
  for (const nome of CAMADAS_OBRIGATORIAS) dados[nome] = await lerJSON(`${nome}.geojson`);
  for (const nome of CAMADAS_OPCIONAIS)    dados[nome] = await lerJSON(`${nome}.geojson`, true);
  const metadados = await lerJSON('metadados_cena.json', true);

  // 6.2 - Extensão da cena: AOI, vias e água (a água vai até a moldura)
  const lim = limitesDe([dados.aoi, dados.vias, dados.agua]);
  const largura = lim.xmax - lim.xmin;
  const profund = lim.ymax - lim.ymin;
  const cx = (lim.xmin + lim.xmax) / 2;
  const cy = (lim.ymin + lim.ymax) / 2;
  const extensao = Math.max(largura, profund);

  // 6.3 - Renderizador
  const container = document.getElementById('cena');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  const cena = new THREE.Scene();

  // 6.4 - Câmera ortográfica: sem perspectiva, como numa vista isométrica.
  // O enquadramento inicial mostra a extensão toda; o zoom altera camera.zoom.
  const aspecto = () => window.innerWidth / window.innerHeight;
  const meia = extensao * 0.62;
  const camera = new THREE.OrthographicCamera(
    -meia * aspecto(), meia * aspecto(), meia, -meia, 1, extensao * 20);
  // posição isométrica clássica: cerca de 35° de elevação, com o azimute
  // girado pela orientação da grade das ruas (seção 2.8.4)
  const alvo = new THREE.Vector3(cx, 0, -cy);
  const giroGrade = anguloGrade(dados.eixos);
  const azGrade = azimuteIso(giroGrade);
  const distOrto = extensao * 2 * Math.sqrt(3);                    // mesma distância da versão 1.0
  const polarIso = Math.acos(1 / Math.sqrt(3));                    // elevação isométrica (~35,3°)
  camera.position.setFromSphericalCoords(distOrto, polarIso, azGrade).add(alvo);
  camera.lookAt(alvo);
  // câmera em perspectiva, usada quando o controle "Perspectiva" é marcado
  const cameraPersp = new THREE.PerspectiveCamera(FOV_PERSPECTIVA, aspecto(), 1, extensao * 8);
  const vista = { camera };   // câmera ativa, lida pelas funções da cena

  // 6.5 - Controles: girar, arrastar e aproximar, com limites de inclinação
  const controles = new OrbitControls(camera, renderer.domElement);
  controles.target.copy(alvo);
  controles.enableDamping = true;
  controles.screenSpacePanning = true;
  controles.minPolarAngle = THREE.MathUtils.degToRad(15);
  controles.maxPolarAngle = THREE.MathUtils.degToRad(75);
  controles.minZoom = 0.6;
  // zoom máximo profundo (seção 2.8.2): de perto se leem as marcações, as
  // faixas de pedestre, os veículos e as copas
  controles.maxZoom = ZOOM_MAXIMO;
  controles.minDistance = 25;                 // usados só na perspectiva
  controles.maxDistance = extensao * 3;
  controles.update();

  // 6.5.1 - Troca entre ortográfica e perspectiva, mantendo o enquadramento:
  // a altura visível no alvo (2 x meia / zoom) define a distância da câmera
  // em perspectiva, e vice-versa
  const tanFov = Math.tan(THREE.MathUtils.degToRad(FOV_PERSPECTIVA / 2));
  function trocarCamera(perspectiva) {
    const atual = vista.camera;
    const dir = atual.position.clone().sub(controles.target).normalize();
    if (perspectiva && !atual.isPerspectiveCamera) {
      const d = (meia / camera.zoom) / tanFov;
      cameraPersp.position.copy(controles.target).addScaledVector(dir, d);
      cameraPersp.aspect = aspecto();
      cameraPersp.updateProjectionMatrix();
      vista.camera = cameraPersp;
      controles.maxPolarAngle = THREE.MathUtils.degToRad(POLAR_MAX_PERSP);
    } else if (!perspectiva && atual.isPerspectiveCamera) {
      const d = cameraPersp.position.distanceTo(controles.target);
      camera.zoom = THREE.MathUtils.clamp(meia / (d * tanFov), controles.minZoom, controles.maxZoom);
      camera.position.copy(controles.target).addScaledVector(dir, distOrto);
      camera.updateProjectionMatrix();
      vista.camera = camera;
      controles.maxPolarAngle = THREE.MathUtils.degToRad(75);
    }
    controles.object = vista.camera;
    vista.camera.lookAt(controles.target);
    controles.update();
  }

  // 6.5.2 - Giro animado da vista até um azimute (botões Norte e Grade),
  // mantendo a inclinação e a distância; o laço de desenho avança o giro
  let giro = null;
  function girarPara(azimute) {
    const esf = new THREE.Spherical().setFromVector3(vista.camera.position.clone().sub(controles.target));
    let delta = azimute - esf.theta;
    delta = Math.atan2(Math.sin(delta), Math.cos(delta));    // pelo caminho mais curto
    giro = { de: esf.theta, delta, t: 0 };
  }
  function avancarGiro(dt) {
    if (!giro) return;
    giro.t = Math.min(1, giro.t + dt / DURACAO_GIRO_S);
    const esf = new THREE.Spherical().setFromVector3(vista.camera.position.clone().sub(controles.target));
    esf.theta = giro.de + giro.delta * THREE.MathUtils.smootherstep(giro.t, 0, 1);
    vista.camera.position.setFromSpherical(esf).add(controles.target);
    vista.camera.lookAt(controles.target);
    if (giro.t >= 1) giro = null;
  }

  // 6.6 - Luzes: hemisférica (céu e chão) e direcional (Sol, movida pelo relógio)
  const luzCeu = new THREE.HemisphereLight(0xdfefff, 0x8a7a60, 1.0);
  cena.add(luzCeu);
  const sol = new THREE.DirectionalLight(0xfff4e0, 2.4);
  sol.target.position.copy(alvo);
  cena.add(sol, sol.target);

  // luzes de fachada (seção 2.5): quase horizontais, uma do sudeste (lado da
  // câmera inicial) e outra do noroeste; a intensidade acompanha o relógio
  const fachada = new THREE.DirectionalLight(0xffffff, LUZ_FACHADA);
  fachada.position.copy(alvo).add(new THREE.Vector3(1, ELEVACAO_FACHADA, 1).multiplyScalar(extensao));
  fachada.target.position.copy(alvo);
  const fachadaOposta = new THREE.DirectionalLight(0xffffff, LUZ_FACHADA_OPOSTA);
  fachadaOposta.position.copy(alvo).add(new THREE.Vector3(-1, ELEVACAO_FACHADA, -1).multiplyScalar(extensao));
  fachadaOposta.target.position.copy(alvo);
  cena.add(fachada, fachada.target, fachadaOposta, fachadaOposta.target);

  // 6.7 - Chão e base do diorama. Com eixos.geojson, piso vetorial (seção
  // 4A) sobre um plano liso na cor do campo; sem ele, a textura da seção 4.
  const pisoVetorial = Boolean(dados.eixos && dados.eixos.features.length > 0);
  let triangulosPiso = 0;
  let chao;
  let pisoGrupo = null;
  let luzesNoite = { grupo: new THREE.Group(), ajustar: () => {} };
  if (pisoVetorial) {
    chao = new THREE.Mesh(
      new THREE.PlaneGeometry(largura, profund).rotateX(-Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: COR_CAMPO, roughness: 1, metalness: 0, depthWrite: false })
    );
    chao.renderOrder = -95;   // primeiro da pilha do piso
    await avisar('Montando o piso (quadras, calçadas, vias e faixas)…');
    const piso = construirPiso(dados);
    cena.add(piso.grupo);
    triangulosPiso = piso.triangulos;
    pisoGrupo = piso.grupo;
    luzesNoite = construirLuzesNoturnas(dados.eixos);
    cena.add(luzesNoite.grupo);
  } else {
    await avisar('Desenhando o chão (vias, água, áreas verdes)…');
    const texturaChao = desenharChao(dados, lim);
    texturaChao.anisotropy = renderer.capabilities.getMaxAnisotropy();
    chao = new THREE.Mesh(
      new THREE.PlaneGeometry(largura, profund).rotateX(-Math.PI / 2),
      new THREE.MeshStandardMaterial({ map: texturaChao, roughness: 1, metalness: 0 })
    );
  }
  chao.position.set(cx, 0, -cy);
  cena.add(chao);

  // base: caixa logo abaixo do chão, com laterais em cor de terra; desenhada
  // antes do piso, que não grava profundidade e por isso precisa vir depois
  const base = new THREE.Mesh(
    new THREE.BoxGeometry(largura, ESPESSURA_BASE_M, profund),
    new THREE.MeshStandardMaterial({ color: COR_BASE, roughness: 1 })
  );
  base.position.set(cx, -ESPESSURA_BASE_M / 2 - 0.5, -cy);
  base.renderOrder = -100;
  cena.add(base);

  // 6.8 - Edificações
  await avisar(`Montando ${dados.edificacoes.features.length.toLocaleString('pt-BR')} edificações…`);
  const { malha: edificacoes, n, edificacaoEm, edificacaoProxima, hMax, contato } = construirEdificacoes(dados.edificacoes);
  edificacoes.scale.y = EXAGERO_INICIAL;
  cena.add(edificacoes, contato);

  // 6.8.1 - Árvores nas áreas verdes
  await avisar('Plantando árvores nas áreas verdes…');
  const { grupo: arvores, n: nArvores, nPalmeiras, ajustarDetalhe: detalheArvores, mostrarContornos } =
    plantarArvores(dados.arvoredo ?? dados.verde, dados.agua, dados.edificacoes, pisoVetorial ? dados.eixos : null,
                   dados.arvores_pontos);
  cena.add(arvores);

  // 6.8.1.1 - Veículos (só com o piso vetorial, que traz a rede de eixos)
  const veiculos = pisoVetorial ? criarVeiculos(dados) : { grupo: new THREE.Group(), contagem: [], mover: () => {} };
  cena.add(veiculos.grupo);

  // 6.8.1.2 - Sombra do avião (seção 2.8.1): só o avião projeta; chão, piso e
  // edificações recebem. A caixa da sombra acompanha o avião no laço (8.2).
  const aviao = veiculos.aviao?.malha ?? null;
  const dirSol = new THREE.Vector3(0, 1, 0);   // atualizada pelo relógio (7.2)
  if (aviao) {
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    sol.castShadow = true;
    sol.shadow.mapSize.set(SOMBRA_AVIAO_MAPA_PX, SOMBRA_AVIAO_MAPA_PX);
    sol.shadow.bias = -0.0005;
    const sc = sol.shadow.camera;
    sc.left = sc.bottom = -SOMBRA_AVIAO_LADO_M;
    sc.right = sc.top = SOMBRA_AVIAO_LADO_M;
    sc.near = 1;
    sc.updateProjectionMatrix();
    aviao.castShadow = true;
    edificacoes.receiveShadow = true;
    chao.receiveShadow = true;
    pisoGrupo?.traverse(o => { if (o.isMesh) o.receiveShadow = true; });
  }
  // o Sol fica a DIST_SOL do avião, na direção da luz; a caixa vai até o chão
  const DIST_SOL = 600;
  function seguirAviao() {
    if (!aviao) return;
    sol.target.position.copy(aviao.position);
    sol.position.copy(aviao.position).addScaledVector(dirSol, DIST_SOL);
    sol.shadow.camera.far = DIST_SOL + aviao.position.y / Math.max(dirSol.y, 0.05) + 400;
    sol.shadow.camera.updateProjectionMatrix();
  }

  // 6.8.2 - Nuvens sobre as bordas
  const nuvens = criarNuvens(lim, extensao);
  cena.add(nuvens.grupo);

  // 6.8.3 - Névoa: distâncias medidas a partir da câmera, cuja distância ao
  // alvo não muda com o zoom (na câmera ortográfica o zoom não a aproxima)
  const distCamera = camera.position.distanceTo(alvo);
  const nevoa = new THREE.Fog(0xa9d4ea,
    distCamera + NEVOA_INICIO * extensao, distCamera + NEVOA_FIM * extensao);
  cena.fog = nevoa;

  // 6.9 - Créditos e subtítulo a partir de metadados_cena.json
  if (metadados) {
    const elCred = document.getElementById('creditos');
    // fontes e licenças dos dados (metadados_cena.json), seguidas da
    // declaração de assistência no desenvolvimento
    // [].concat aceita tanto lista quanto texto único (o jsonlite grava um
    // vetor de tamanho 1 como texto); as ressalvas do piso só se aplicam ao
    // piso vetorial
    const ressalvas = pisoVetorial ? [].concat(metadados.ressalvas ?? []) : [];
    elCred.innerHTML = [].concat(metadados.creditos ?? []).map(t => `<div>${t}</div>`).join('')
      + (ressalvas.length
          ? '<div class="ressalvas"><b>Ressalvas</b>' + ressalvas.map(t => `<div>${t}</div>`).join('') + '</div>'
          : '')
      + '<div class="assistencia">Versão 1.1.0 · Desenvolvido com assistência Anthropic - Claude LLM Opus 5.5</div>';
    // a lista começa fechada; o botão "Fontes" abre e fecha
    const elBotaoFontes = document.getElementById('botao-fontes');
    elBotaoFontes.hidden = false;
    elBotaoFontes.addEventListener('click', () => { elCred.hidden = !elCred.hidden; });
    document.getElementById('subtitulo').textContent =
      `Maranhão, Brasil · alturas de ${metadados.ano_alturas ?? 2023}`;
  }


  // ---------------------------------------------------------------------------
  // 7. - Relógio do dia
  // ---------------------------------------------------------------------------

  // 7.1 - Cores de céu e de luz ao longo do dia
  const corNoite = new THREE.Color('#1c2440');
  const corAurora = new THREE.Color('#e9a27a');
  const corDia    = new THREE.Color('#a9d4ea');
  const luzQuente = new THREE.Color('#ffb36b');
  const luzBranca = new THREE.Color('#fff4e0');
  const raio = extensao * 3;   // distância do Sol ao centro (só define a direção)

  // 7.2 - Posição do Sol para uma hora decimal (5 a 19).
  // Modelo simples: o Sol nasce a leste às 6 h, culmina às 12 h e se põe a
  // oeste às 18 h, descrevendo meio círculo; DESVIO_SOL_SUL o inclina para o sul.
  function aplicarHora(hora) {
    const theta = (hora - 6) / 12 * Math.PI;
    const elev  = Math.sin(theta);                    // altura do Sol (-1 a 1)
    // 0 = noite, 1 = dia pleno; a transição ocupa o trecho em que o Sol está
    // baixo (elevação de -0,05 a 0,35), que corresponde ao fim da tarde e ao amanhecer
    const dia   = THREE.MathUtils.smoothstep(elev, -0.05, 0.35);

    const dir = new THREE.Vector3(Math.cos(theta), Math.max(elev, 0.04), DESVIO_SOL_SUL).normalize();
    sol.position.copy(alvo).addScaledVector(dir, raio);
    dirSol.copy(dir);
    seguirAviao();
    // noite: janelas acesas (5.6) e vias iluminadas (4A.10)
    uNoite.value = 1 - dia;
    luzesNoite.ajustar(1 - dia);
    sol.intensity = 2.6 * dia;
    sol.color.copy(luzQuente).lerp(luzBranca, dia);
    luzCeu.intensity = 0.35 + 0.85 * dia;
    fachada.intensity       = LUZ_FACHADA        * (0.25 + 0.75 * dia);
    fachadaOposta.intensity = LUZ_FACHADA_OPOSTA * (0.25 + 0.75 * dia);

    // sombras das árvores: lado oposto ao Sol, mais longas com o Sol baixo
    // (limitadas a 2,5 vezes a altura) e apagadas à noite
    const alcance = 1 / Math.max(dir.y, 0.25);
    deslocSombra.value.set(-dir.x, -dir.z).normalize().multiplyScalar(Math.min(alcance * Math.hypot(dir.x, dir.z), 2.5));
    if (materialSombra) materialSombra.opacity = OPACIDADE_SOMBRA * dia;

    // céu: noite → aurora → dia, com a aurora concentrada perto do horizonte
    const fundo = dia < 0.35
      ? corNoite.clone().lerp(corAurora, dia / 0.35)
      : corAurora.clone().lerp(corDia, (dia - 0.35) / 0.65);
    cena.background = fundo;
    nevoa.color.copy(fundo);   // a névoa se funde com o céu
    document.body.style.background = fundo.getStyle();

    // relógio no formato HH:MM
    const hh = Math.floor(hora), mm = Math.floor((hora - hh) * 60);
    document.getElementById('relogio').textContent =
      `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  }

  // 7.3 - Controles do painel
  const elHora    = document.getElementById('controle-hora');
  const elExagero = document.getElementById('controle-exagero');
  const elPlay    = document.getElementById('botao-play');
  let hora = HORA_INICIAL;
  let tocando = false;

  elHora.addEventListener('input', () => { hora = parseFloat(elHora.value); aplicarHora(hora); });
  elExagero.addEventListener('input', () => {
    edificacoes.scale.y = parseFloat(elExagero.value);
    brasoes.atualizar(parseFloat(elExagero.value));
    document.getElementById('valor-exagero').textContent = `${elExagero.value}×`;
  });
  document.getElementById('controle-arvores').addEventListener('change', e => { arvores.visible = e.target.checked; });
  document.getElementById('controle-contornos').addEventListener('change', e => mostrarContornos?.(e.target.checked));
  document.getElementById('controle-nuvens').addEventListener('change',  e => { nuvens.grupo.visible = e.target.checked; });
  document.getElementById('controle-nevoa').addEventListener('change',   e => { cena.fog = e.target.checked ? nevoa : null; });
  document.getElementById('controle-veiculos').addEventListener('change', e => { veiculos.grupo.visible = e.target.checked; });
  document.getElementById('controle-contato').addEventListener('change', e => {
    contato.visible = e.target.checked;
    uContato.value = e.target.checked ? 1 : 0;
  });
  document.getElementById('controle-perspectiva').addEventListener('change', e => trocarCamera(e.target.checked));
  document.getElementById('botao-norte').addEventListener('click', () => girarPara(0));
  document.getElementById('botao-grade').addEventListener('click', () => girarPara(azGrade));
  elPlay.addEventListener('click', () => {
    tocando = !tocando;
    elPlay.textContent = tocando ? '❚❚ Pausar' : '▶ Reproduzir dia';
  });

  aplicarHora(hora);


  // ---------------------------------------------------------------------------
  // 8. - Laço de desenho
  // ---------------------------------------------------------------------------

  // 7.4 - Pixel art (seção 2.8.2 e função 5D): desligado, ao aproximar ou
  // sempre; o tamanho do pixel vem do controle "Pixel"
  const pixelArt = criarPixelArt(renderer, vista);
  const elModoPixel = document.getElementById('controle-pixel');
  let modoPixel = parseInt(elModoPixel.value, 10);
  elModoPixel.addEventListener('change', () => { modoPixel = parseInt(elModoPixel.value, 10); });
  const elTamPixel = document.getElementById('controle-tam-pixel');
  elTamPixel.addEventListener('input', () => {
    pixelArt.redimensionar(parseFloat(elTamPixel.value));
    document.getElementById('valor-tam-pixel').textContent = elTamPixel.value;
  });
  // metros por pixel da tela no alvo da câmera
  function metrosPorPixel() {
    const c = vista.camera;
    const alturaVisivel = c.isPerspectiveCamera
      ? 2 * c.position.distanceTo(controles.target) * tanFov
      : (c.top - c.bottom) / c.zoom;
    return alturaVisivel / window.innerHeight;
  }
  function alfaPixel() {
    if (modoPixel === 0) return 0;
    if (modoPixel === 2) return 1;
    return THREE.MathUtils.clamp((PIXEL_MPP_INICIO - metrosPorPixel()) /
                                 (PIXEL_MPP_INICIO - PIXEL_MPP_COMPLETO), 0, 1);
  }

  // 7.6 - Brasões nas fachadas (seção 2.8.3)
  const brasoes = criarBrasoes(cena, renderer, edificacaoProxima, metadados, pisoVetorial ? dados.eixos : null);

  // 7.5 - Identificação por duplo clique (seção 6.10)
  const identificar = criarIdentificacao(cena, vista, renderer, edificacoes, edificacaoEm, hMax, metadados,
                                        criarLocalizador(dados));
  renderer.domElement.addEventListener('dblclick', identificar);

  // 8.1 - Ajuste ao redimensionar a janela
  window.addEventListener('resize', () => {
    camera.left = -meia * aspecto();
    camera.right = meia * aspecto();
    camera.updateProjectionMatrix();
    cameraPersp.aspect = aspecto();
    cameraPersp.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    pixelArt.redimensionar();
  });

  // 8.2 - Cada quadro: avança o relógio (se em reprodução), atualiza os
  // controles e desenha
  const cronometro = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    // dt limitado a 0,1 s: ao voltar de outra aba, o tráfego não dá um salto
    const dt = Math.min(cronometro.getDelta(), 0.1);
    tempoVento.value += dt;
    if (veiculos.grupo.visible) veiculos.mover(dt);
    if (tocando) {
      hora += dt * HORAS_POR_SEGUNDO;
      if (hora > 19) hora = 5;
      elHora.value = hora;
      aplicarHora(hora);
    }
    nuvens.mover(dt);
    avancarGiro(dt);
    controles.update();
    seguirAviao();
    // névoa e planos de recorte acompanham a distância da câmera ao alvo
    // (na perspectiva, o zoom aproxima a câmera)
    const dist = vista.camera.position.distanceTo(controles.target);
    nevoa.near = dist + NEVOA_INICIO * extensao;
    nevoa.far  = dist + NEVOA_FIM * extensao;
    if (vista.camera.isPerspectiveCamera) {
      cameraPersp.near = Math.max(0.5, dist * 0.004);
      cameraPersp.far  = dist + extensao * 3;
      cameraPersp.updateProjectionMatrix();
    }
    detalheArvores?.(metrosPorPixel());   // copas completas de perto, bolotas de longe
    const alfa = alfaPixel();
    if (alfa < 1) renderer.render(cena, vista.camera);
    if (alfa > 0) pixelArt.desenhar(cena, alfa);
  });

  elStatus.hidden = true;
  document.getElementById('painel').hidden = false;

  // tecla H: liga e desliga o modo vídeo (interface escondida, assinatura
  // discreta); funciona com o teclado em português ou inglês, maiúscula ou não
  window.addEventListener('keydown', e => {
    if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('modo-video');
  });
  // expõe um resumo para conferência no console do navegador (F12)
  window.cenaInfo = { edificacoes: n, arvores: nArvores, palmeiras: nPalmeiras, extensao_m: Math.round(extensao), piso: pisoVetorial ? 'vetorial' : 'textura', triangulos_piso: triangulosPiso,
                     veiculos: veiculos.contagem, grade_graus: +THREE.MathUtils.radToDeg(giroGrade).toFixed(1) };
  // acesso à câmera pelo console, para conferências (camera = câmera ativa)
  window.cenaControle = { get camera() { return vista.camera; }, controles, cena, renderer, veiculos: veiculos.grupo, brasoes: brasoes.placas,
                          aviao, trocarCamera, girarPara, ajustarHora: h => { hora = h; elHora.value = h; aplicarHora(h); } };
}

// Executa e mostra qualquer falha na tela, em vez de deixar a página em branco
principal().catch(err => {
  console.error(err);
  mostrarErro(`Erro ao montar a cena: ${err.message}`);
});
</script>
